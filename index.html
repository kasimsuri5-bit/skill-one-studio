<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Neural Voice Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #080808; color: #fff; font-family: 'Inter', sans-serif; }
        .sidebar { background: #000; border-right: 1px solid #222; min-height: 100vh; }
        .premium-card { background: linear-gradient(145deg, #111, #000); border: 1px solid #333; border-radius: 24px; transition: 0.3s; }
        .premium-card:hover { border-color: #6366f1; transform: translateY(-2px); }
        .btn-generate { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-weight: 900; letter-spacing: 2px; }
        .btn-generate:hover { box-shadow: 0 0 30px rgba(99, 102, 241, 0.4); }
        .voice-btn { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 16px; cursor: pointer; transition: 0.2s; text-align: center; }
        .voice-btn.active { border-color: #6366f1; background: rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="flex">

    <div class="w-72 sidebar p-8 hidden md:flex flex-col">
        <div class="mb-10">
            <h1 class="text-3xl font-black italic text-white uppercase tracking-tighter">AZEEM STUDIO</h1>
            <p class="text-[10px] text-indigo-500 font-bold tracking-[4px] mt-1">Pak Viral Network</p>
        </div>
        <div class="flex-1 space-y-4">
            <div class="p-4 bg-indigo-600/10 rounded-xl text-white font-bold flex items-center gap-3">
                <i class="fas fa-microchip"></i> Neural Engine
            </div>
            <div class="p-4 text-gray-500 font-bold flex items-center gap-3 cursor-pointer">
                <i class="fas fa-globe"></i> All Languages
            </div>
        </div>
        <div class="mt-auto pt-6 border-t border-gray-800 text-[11px] text-gray-500 font-bold uppercase text-center italic">
            No Credits Required
        </div>
    </div>

    <main class="flex-1 p-6 md:p-12 overflow-y-auto">
        <div class="max-w-5xl mx-auto">
            <h2 class="text-5xl font-black italic mb-10 tracking-tighter text-white">Neural Synthesis</h2>

            <div class="premium-card p-8 mb-8 shadow-2xl">
                <textarea id="script" class="w-full h-80 bg-transparent text-gray-100 text-2xl leading-relaxed outline-none resize-none" placeholder="Azeem bhai, yahan apna script likhein (Urdu, Hindi, ya English)..."></textarea>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="voice-btn active" id="uzma" onclick="setVoice('ur-PK-UzmaNeural', 'uzma')">
                    <p class="font-bold text-sm">Uzma (Urdu)</p>
                    <p class="text-[10px] text-gray-500 italic uppercase">Best for News</p>
                </div>
                <div class="voice-btn" id="asad" onclick="setVoice('ur-PK-AsadNeural', 'asad')">
                    <p class="font-bold text-sm">Asad (Urdu)</p>
                    <p class="text-[10px] text-gray-500 italic uppercase">Deep Male</p>
                </div>
                <div class="voice-btn" id="swara" onclick="setVoice('hi-IN-SwaraNeural', 'swara')">
                    <p class="font-bold text-sm">Swara (Hindi)</p>
                    <p class="text-[10px] text-gray-500 italic uppercase">Documentary</p>
                </div>
                <div class="voice-btn" id="andrew" onclick="setVoice('en-US-AndrewNeural', 'andrew')">
                    <p class="font-bold text-sm">Andrew (Eng)</p>
                    <p class="text-[10px] text-gray-500 italic uppercase">US Accent</p>
                </div>
            </div>

            <button onclick="generateNeuralVoice()" id="btn" class="w-full btn-generate py-6 rounded-[24px] text-white uppercase font-black text-sm flex items-center justify-center gap-4 shadow-xl">
                <i class="fas fa-play text-xl"></i>
                <span>Generate Professional Voice</span>
            </button>

            <div id="status" class="mt-8 text-center text-[10px] font-bold text-gray-600 tracking-[5px] uppercase italic">System Ready: Infinite Characters</div>
        </div>
    </main>

    <script>
        let selectedVoice = 'ur-PK-UzmaNeural';

        function setVoice(voice, id) {
            selectedVoice = voice;
            document.querySelectorAll('.voice-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        async function generateNeuralVoice() {
            const text = document.getElementById('script').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if(!text) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> <span>Synthesizing...</span>`;
            status.innerText = "Connecting to Microsoft Neural Servers...";

            // In a real environment, we would use a Python backend with 'edge-tts' 
            // for the highest quality. This frontend is ready to link to it.
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Auto-detect language or use selected
            utterance.lang = selectedVoice.substring(0, 5); 
            utterance.rate = 0.9; // Professional speed

            // Trigger Voice
            synth.speak(utterance);

            utterance.onend = () => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-play text-xl"></i> <span>Generate Professional Voice</span>`;
                status.innerText = "Voice Generated Successfully!";
            };
        }
    </script>
</body>
</html>
