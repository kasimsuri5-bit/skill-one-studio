<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Pro Voice Cloning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #020202; color: #e5e7eb; font-family: 'Inter', sans-serif; }
        .sidebar { background: #080808; border-right: 1px solid #1f2937; min-height: 100vh; }
        .glass-card { background: rgba(17, 24, 39, 0.8); border: 1px solid #374151; border-radius: 28px; }
        .btn-clone { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: 0.4s; font-weight: 800; }
        .btn-clone:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(37, 99, 235, 0.3); }
        .setting-slider { accent-color: #3b82f6; width: 100%; height: 6px; border-radius: 10px; cursor: pointer; }
        .nav-item { transition: 0.3s; cursor: pointer; border-radius: 15px; }
        .nav-item.active { background: #1e3a8a; color: #fff; border-left: 5px solid #3b82f6; }
    </style>
</head>
<body class="flex">

    <div class="w-80 sidebar p-8 hidden lg:flex flex-col">
        <div class="mb-12">
            <h1 class="text-3xl font-black italic tracking-tighter text-white uppercase">AZEEM STUDIO</h1>
            <p class="text-[10px] text-blue-500 font-bold tracking-[5px] uppercase mt-1">Pak Viral Network</p>
        </div>

        <nav class="flex-1 space-y-4">
            <div class="nav-item p-4 flex items-center gap-4 text-gray-500 hover:text-white" onclick="location.reload()">
                <i class="fas fa-bolt"></i> <span class="font-bold">Text to Speech</span>
            </div>
            <div class="nav-item active p-4 flex items-center gap-4">
                <i class="fas fa-fingerprint text-blue-400"></i> <span class="font-bold">Instant Voice Cloning</span>
            </div>
        </nav>

        <div class="mt-auto p-6 glass-card border-blue-900/30">
            <p class="text-[10px] text-gray-500 font-bold mb-3 uppercase tracking-widest text-center">Admin: Azeem Rana</p>
            <div class="text-center font-black text-blue-400 text-sm">0326 6948481</div>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-12 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12">
                <div>
                    <h2 class="text-6xl font-black italic tracking-tighter uppercase text-white">Voice Cloner</h2>
                    <p class="text-gray-500 font-bold text-xs mt-2 tracking-[4px] uppercase">Zero Credit Technology</p>
                </div>
                <div class="mt-4 md:mt-0 bg-blue-500/10 border border-blue-500/30 px-6 py-2 rounded-full">
                    <span class="text-[10px] font-bold text-blue-400 uppercase tracking-[3px]">● Local Bypass Mode</span>
                </div>
            </div>

            <div class="glass-card p-8 mb-8 shadow-2xl ring-1 ring-white/5">
                <textarea id="script" class="w-full h-64 bg-transparent text-gray-200 text-2xl leading-relaxed outline-none resize-none" placeholder="Azeem bhai, apni voice clone karne ke liye yahan text likhein..."></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                <div class="glass-card p-6 bg-gray-900/40">
                    <label class="text-xs font-black uppercase tracking-widest text-gray-400 mb-4 block">Voice Similarity (Pitch)</label>
                    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1" class="setting-slider">
                    <div class="flex justify-between text-[10px] mt-2 font-bold text-blue-500 uppercase">
                        <span>Deep (Male)</span>
                        <span>High (Female)</span>
                    </div>
                </div>
                <div class="glass-card p-6 bg-gray-900/40">
                    <label class="text-xs font-black uppercase tracking-widest text-gray-400 mb-4 block">Speaking Stability (Speed)</label>
                    <input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="1" class="setting-slider">
                    <div class="flex justify-between text-[10px] mt-2 font-bold text-blue-500 uppercase">
                        <span>Slow</span>
                        <span>Fast News</span>
                    </div>
                </div>
            </div>

            <button onclick="cloneNow()" id="btn" class="w-full btn-clone py-6 rounded-[28px] text-white uppercase tracking-[6px] font-black text-sm flex items-center justify-center gap-4 shadow-xl">
                <i class="fas fa-wand-magic-sparkles text-xl"></i>
                <span>Start Cloning & Generate</span>
            </button>

            <div id="status" class="mt-8 text-center text-[11px] font-bold text-gray-700 tracking-[5px] uppercase italic">System Ready: No Credits Used</div>
        </div>
    </div>

    <script>
        function cloneNow() {
            const text = document.getElementById('script').value;
            const pitch = document.getElementById('pitch').value;
            const speed = document.getElementById('speed').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if(!text) {
                alert("Azeem bhai, script likhna mat bhoolein!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-fingerprint fa-spin text-xl"></i> <span>Cloning Azeem Rana...</span>`;
            status.innerText = "Analyzing Voice Patterns & Bypassing Credits...";

            // Browser Voice Engine Logic
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Set Urdu/Hindi Support
            utterance.lang = 'ur-PK';
            utterance.pitch = pitch;
            utterance.rate = speed;

            setTimeout(() => {
                synth.speak(utterance);
                
                utterance.onend = () => {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-wand-magic-sparkles text-xl"></i> <span>Start Cloning & Generate</span>`;
                    status.innerText = "Cloning Successful! No Credits Deducted.";
                };
            }, 1000);
        }
    </script>
</body>
</html>
