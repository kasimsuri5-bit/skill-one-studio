<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Ultimate Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap');
        body { background: #010409; color: #e6edf3; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(13, 17, 23, 0.95); border: 1px solid #30363d; backdrop-filter: blur(15px); border-radius: 25px; }
        .glow-button { background: linear-gradient(135deg, #1f6feb 0%, #8957e5 100%); transition: 0.4s; }
        .glow-button:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(31, 111, 235, 0.4); }
        .neon-accent { color: #58a6ff; text-shadow: 0 0 10px rgba(88, 166, 255, 0.5); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-[#0d1117] border-r border-[#30363d] flex flex-col p-8">
        <div class="mb-12">
            <h1 style="font-family: 'Orbitron';" class="text-3xl font-black italic neon-accent leading-none">AZEEM STUDIO</h1>
            <p class="text-[9px] font-bold text-gray-500 tracking-[5px] uppercase mt-3">Pak Viral Network</p>
        </div>
        
        <nav class="flex-1 space-y-4">
            <button onclick="switchMode('tts')" class="w-full flex items-center space-x-4 p-5 rounded-2xl bg-[#161b22] border border-blue-500/30 text-sm font-bold">
                <i class="fas fa-volume-up text-blue-400"></i><span>Pro Synthesis</span>
            </button>
            <button onclick="switchMode('clone')" class="w-full flex items-center space-x-4 p-5 rounded-2xl hover:bg-white/5 text-sm font-bold text-gray-400">
                <i class="fas fa-microchip text-purple-500"></i><span>Advanced Cloning</span>
            </button>
        </nav>

        <div class="mt-auto glass-card p-6 text-center">
            <p class="text-[10px] text-blue-400 font-black mb-3 uppercase tracking-widest italic">Azeem Rana Edition</p>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-4 bg-[#238636] text-white text-[11px] font-black rounded-xl uppercase hover:bg-[#2ea043] transition-all">Support & Keys</button>
        </div>
    </aside>

    <main class="flex-1 p-16 overflow-y-auto bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-blue-900/10 via-transparent to-transparent">
        
        <div id="tts-tab">
            <div class="mb-10">
                <h2 class="text-5xl font-black italic uppercase tracking-tighter mb-2">Synthesis Lab</h2>
                <div class="flex items-center space-x-3">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    <p class="text-gray-400 font-bold text-[10px] uppercase tracking-widest">Multiple AI Engines Active</p>
                </div>
            </div>

            <textarea id="mainScript" class="w-full h-80 p-10 text-2xl bg-[#0d1117] border border-[#30363d] rounded-[30px] outline-none mb-10 shadow-inner focus:border-blue-500 transition-all" placeholder="Azeem bhai, naya news script yahan likhein..."></textarea>

            <div class="flex items-center space-x-8">
                <div class="flex-1">
                    <select id="voicePick" class="w-full p-6 bg-[#161b22] border border-[#30363d] rounded-2xl text-white font-bold outline-none cursor-pointer hover:border-blue-500 transition-all">
                        <option value="pNInz6obpgDQGcFmaJgB">Adam (Classic News - Deep)</option>
                        <option value="erXw7eAyq3QCqU2jt0pA">Antoni (Best for Urdu/Hindi)</option>
                        <option value="21m00Tcm4labaLutUeXy">Bella (Professional News Female)</option>
                        <option value="EXAVITQu4vr4xnSDxMaL">Sarah (Documentary Style)</option>
                        <option id="customVoice" value="" disabled>My Cloned Voice (Upload Sample)</option>
                    </select>
                </div>
                <button onclick="synthesize()" id="genBtn" class="glow-button px-16 py-6 rounded-2xl text-[12px] font-black uppercase text-white tracking-widest">Generate Audio</button>
                <a id="dlBtn" class="hidden bg-blue-600 hover:bg-blue-500 px-12 py-6 rounded-2xl text-[12px] font-black uppercase transition-all">Download MP3</a>
            </div>
            <div id="status" class="mt-10 text-[10px] text-gray-500 font-black uppercase tracking-[4px]">Status: Engine Standby</div>
        </div>

        <div id="clone-tab" class="hidden">
            <h2 class="text-5xl font-black italic uppercase tracking-tighter mb-12">Universal Cloning</h2>
            <div class="glass-card border-dashed border-2 border-blue-500/30 p-24 text-center max-w-4xl">
                <i class="fas fa-upload text-5xl text-blue-500 mb-8"></i>
                <h3 class="text-3xl font-black mb-4 uppercase">Create Your Voice Clone</h3>
                <p class="text-gray-400 mb-12 text-sm font-bold tracking-widest max-w-md mx-auto">Upload 60 seconds of clear audio. This will work across all synthesis projects.</p>
                <input type="file" id="voiceFile" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('voiceFile').click()" class="glow-button px-16 py-6 rounded-2xl font-black uppercase text-[12px] tracking-widest">Select Audio File</button>
                <div id="cloneStatus" class="mt-10 text-blue-400 font-black text-xs uppercase tracking-widest"></div>
            </div>
        </div>
    </main>

    <script>
        const KEY = "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f";

        function switchMode(m) {
            document.getElementById('tts-tab').classList.toggle('hidden', m !== 'tts');
            document.getElementById('clone-tab').classList.toggle('hidden', m !== 'clone');
        }

        document.getElementById('voiceFile').onchange = async (e) => {
            const log = document.getElementById('cloneStatus');
            log.innerText = "Analyzing Vocal Patterns & Cloning...";
            
            const fd = new FormData();
            fd.append('name', 'Azeem_Global_Twin');
            fd.append('files', e.target.files[0]);

            try {
                const res = await fetch('https://api.elevenlabs.io/v1/voices/add', {
                    method: 'POST',
                    headers: { 'xi-api-key': KEY },
                    body: fd
                });
                const d = await res.json();
                const v = document.getElementById('customVoice');
                v.value = d.voice_id;
                v.disabled = false;
                v.selected = true;
                v.innerText = "MY CLONED VOICE (READY)";
                log.innerText = "SUCCESS: VOICE CLONED SUCCESSFULLY!";
                setTimeout(() => switchMode('tts'), 2000);
            } catch (err) {
                log.innerText = "QUOTA FULL! TRY NEW KEY.";
            }
        };

        async function synthesize() {
            const txt = document.getElementById('mainScript').value;
            const vId = document.getElementById('voicePick').value;
            const btn = document.getElementById('genBtn');
            const st = document.getElementById('status');

            if(!txt) return alert("Pehle script likhein!");
            btn.innerText = "SYNTHESIZING...";
            st.innerText = "Connecting to Premium High-Fidelity Engine...";

            try {
                const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vId}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: txt,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.9, style: 0.6, use_speaker_boost: true }
                    })
                });

                if(!res.ok) throw new Error();

                const b = await res.blob();
                const u = URL.createObjectURL(b);
                new Audio(u).play();

                const dl = document.getElementById('dlBtn');
                dl.href = u;
                dl.download = "Azeem_Studio_Final.mp3";
                dl.classList.remove('hidden');
                btn.innerText = "Generate Audio";
                st.innerText = "Success: Audio Rendered!";
            } catch (err) {
                alert("Quota khatam ho gaya Azeem bhai! Nayi key use karein.");
                btn.innerText = "Generate Audio";
            }
        }
    </script>
</body>
</html>
