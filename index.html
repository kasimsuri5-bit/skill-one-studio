<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Pro Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #05070a; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow: hidden; }
        .sidebar { background: rgba(11, 14, 20, 0.98); border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .input-area { background: #0c0f16; border: 1px solid #1e293b; border-radius: 20px; width: 100%; height: 350px; padding: 25px; color: white; outline: none; resize: none; font-size: 19px; }
        .btn-gen { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); transition: 0.3s; cursor: pointer; }
        .active-tab { background: linear-gradient(90deg, #4f46e5 0%, transparent 100%); border-left: 4px solid #818cf8; color: white; }
    </style>
</head>
<body class="flex h-screen">

    <aside class="w-80 sidebar flex flex-col p-6">
        <div class="mb-12 px-2">
            <h1 class="text-3xl font-black italic text-white uppercase leading-none">AZEEM STUDIO</h1>
            <p class="text-[9px] font-bold text-indigo-400 tracking-[4px] uppercase mt-1">Pak Viral Network</p>
        </div>
        <nav class="flex-1 space-y-2">
            <div onclick="showTab('synthesis')" id="nav-syn" class="active-tab px-5 py-4 flex items-center space-x-4 cursor-pointer rounded-r-xl font-bold transition-all">
                <i class="fas fa-microphone-alt"></i><span>Voice Synthesis Lab</span>
            </div>
            <div onclick="showTab('cloning')" id="nav-clo" class="px-5 py-4 flex items-center space-x-4 cursor-pointer rounded-xl text-gray-500 hover:text-white font-bold transition-all">
                <i class="fas fa-magic"></i><span>Clone Your Real Voice</span>
            </div>
        </nav>
        <div class="mt-auto p-5 rounded-2xl bg-indigo-600/10 border border-indigo-500/20">
            <p class="text-[10px] font-black text-indigo-300 uppercase mb-2 text-center tracking-tighter">Support: 0326 6948481</p>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-3 bg-white text-black text-[10px] font-black rounded-lg uppercase italic">Contact Azeem Rana</button>
        </div>
    </aside>

    <main class="flex-1 p-16 overflow-y-auto">
        <div id="tab-synthesis">
            <h2 class="text-5xl font-black italic mb-10 text-white uppercase tracking-tighter">Synthesis Lab</h2>
            <textarea id="textInput" class="input-area mb-8" placeholder="Azeem bhai, script paste karein..."></textarea>
            <div class="flex space-x-6 items-center">
                <select id="voiceSelect" class="bg-[#0c0f16] border border-gray-800 p-5 rounded-2xl text-white font-bold w-72 outline-none">
                    <option value="pNInz6obpgDQGcFmaJgB">Adam (Professional News)</option>
                    <option value="21m00Tcm4labaLutUeXy">Bella (Female News)</option>
                    <option id="clonedVoice" value="" disabled>My Real Voice (Not Uploaded)</option>
                </select>
                <button onclick="generateVoice()" id="genBtn" class="btn-gen px-14 py-5 rounded-2xl text-[11px] font-black uppercase text-white shadow-xl shadow-indigo-500/20">Generate Audio</button>
                <a id="dlBtn" class="hidden bg-green-600 px-10 py-5 rounded-2xl text-[11px] font-black uppercase text-white no-underline font-bold">Download MP3</a>
            </div>
            <div id="status" class="mt-8 text-[10px] text-gray-600 font-bold uppercase tracking-[2px]">System Ready</div>
        </div>

        <div id="tab-cloning" class="hidden">
            <h2 class="text-5xl font-black italic mb-10 text-white uppercase tracking-tighter">Real Cloning</h2>
            <div class="bg-[#0c0f16] border-2 border-dashed border-indigo-500/20 p-20 rounded-[40px] text-center">
                <div class="mb-6"><i class="fas fa-cloud-upload-alt text-5xl text-indigo-500"></i></div>
                <h3 class="text-2xl font-bold mb-4 text-white">UPLOAD SAMPLE</h3>
                <input type="file" id="voiceFile" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('voiceFile').click()" class="bg-indigo-600 px-12 py-5 rounded-2xl font-black uppercase text-[11px] tracking-widest hover:bg-indigo-500 transition-all">Select 1 Min Clear Voice</button>
                <div id="cloneStatus" class="mt-8 text-indigo-400 font-black text-xs uppercase tracking-widest"></div>
            </div>
        </div>
    </main>

    <script>
        const KEY = "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f";
        let userVoiceId = "";

        function showTab(tab) {
            document.getElementById('tab-synthesis').classList.toggle('hidden', tab !== 'synthesis');
            document.getElementById('tab-cloning').classList.toggle('hidden', tab !== 'cloning');
            document.getElementById('nav-syn').classList.toggle('active-tab', tab === 'synthesis');
            document.getElementById('nav-clo').classList.toggle('active-tab', tab === 'cloning');
        }

        document.getElementById('voiceFile').onchange = async function(e) {
            const file = e.target.files[0];
            const status = document.getElementById('cloneStatus');
            status.innerText = "UPLOADING TO PRO ENGINE...";

            const formData = new FormData();
            formData.append('name', 'Azeem_Final_Vip');
            formData.append('files', file);

            try {
                const response = await fetch('https://api.elevenlabs.io/v1/voices/add', {
                    method: 'POST',
                    headers: { 'xi-api-key': KEY },
                    body: formData
                });
                const data = await response.json();
                userVoiceId = data.voice_id;
                
                const opt = document.getElementById('clonedVoice');
                opt.value = userVoiceId;
                opt.disabled = false;
                opt.selected = true;
                opt.innerText = "MY REAL VOICE (ACTIVE)";
                
                status.innerText = "VOICE CLONED SUCCESSFULLY!";
                setTimeout(() => showTab('synthesis'), 1500);
            } catch (err) {
                status.innerText = "QUOTA ERROR! CHECK API KEY.";
            }
        };

        async function generateVoice() {
            const text = document.getElementById('textInput').value;
            const vId = document.getElementById('voiceSelect').value;
            const btn = document.getElementById('genBtn');
            const status = document.getElementById('status');

            if(!text) return alert("Pehle script likhein!");
            btn.innerText = "PROCESSING...";
            status.innerText = "ENCRYPTING VOICE FREQUENCY...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vId}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { 
                            stability: 0.45, 
                            similarity_boost: 0.90,
                            style: 0.5,
                            use_speaker_boost: true
                        }
                    })
                });

                if(!response.ok) throw new Error();

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                new Audio(url).play();

                const dl = document.getElementById('dlBtn');
                dl.href = url;
                dl.download = "Azeem_Voice_News.mp3";
                dl.classList.remove('hidden');
                btn.innerText = "Generate Audio";
                status.innerText = "COMPLETED!";
            } catch (err) {
                alert("Quota issue! ElevenLabs account check karein.");
                btn.innerText = "Generate Audio";
            }
        }
    </script>
</body>
</html>
