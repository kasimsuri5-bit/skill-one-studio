<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Studio - ElevenLabs Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); transition: all 0.3s ease; }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        .loader { border-top-color: #6366f1; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-10">

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center mb-12">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl">V</div>
            <h1 class="text-2xl font-bold tracking-tight text-white">VoiceStudio <span class="text-indigo-400 text-sm font-normal">AI</span></h1>
        </div>
        <div class="text-slate-400 text-sm hidden md:block">Next-Gen Text to Speech</div>
    </header>

    <main class="w-full max-w-4xl glass rounded-2xl p-6 md:p-8 shadow-2xl">
        <!-- Settings Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Select Voice Model</label>
                <select id="voiceSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition">
                    <option value="Kore">Kore (Smooth & Calm)</option>
                    <option value="Zephyr">Zephyr (Deep & Bold)</option>
                    <option value="Puck">Puck (Cheerful & Energetic)</option>
                    <option value="Charon">Charon (Professional Narrator)</option>
                    <option value="Fenrir">Fenrir (Dynamic & Strong)</option>
                    <option value="Leda">Leda (Soft & Gentle)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Expression Style</label>
                <select id="styleSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition">
                    <option value="neutral">Neutral / Standard</option>
                    <option value="cheerful">Cheerful & Happy</option>
                    <option value="whisper">Whispering Softly</option>
                    <option value="excited">Highly Excited</option>
                    <option value="serious">Serious / Formal</option>
                </select>
            </div>
        </div>

        <!-- Input Area -->
        <div class="mb-8">
            <label class="block text-sm font-medium text-slate-300 mb-2">Enter your text</label>
            <textarea id="textInput" placeholder="Type or paste your text here..." class="w-full h-48 bg-slate-800 border border-slate-700 rounded-xl p-4 outline-none focus:border-indigo-500 transition resize-none text-lg">Hello! Welcome to your very own AI Voice Studio. I am generated using advanced neural networks. How can I help you today?</textarea>
            <div class="mt-2 text-right text-xs text-slate-500" id="charCount">0 / 5000 characters</div>
        </div>

        <!-- Actions -->
        <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
            <button id="generateBtn" class="w-full md:w-auto btn-gradient px-8 py-4 rounded-xl font-bold flex items-center justify-center gap-2">
                <span id="btnText">Generate Audio</span>
                <div id="btnLoader" class="hidden loader w-5 h-5 border-2 border-white rounded-full"></div>
            </button>
            
            <div id="audioContainer" class="hidden items-center gap-4 bg-slate-900/50 p-2 rounded-xl border border-slate-800 w-full md:w-auto">
                <audio id="audioPlayer" controls class="h-10"></audio>
                <button id="downloadBtn" class="p-2 hover:text-indigo-400 transition" title="Download">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
            </div>
        </div>
    </main>

    <footer class="mt-12 text-slate-500 text-sm">
        Built with Gemini 2.5 Flash TTS Technology
    </footer>

    <script>
        const apiKey = ""; // Runtime automatically provides this
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const textInput = document.getElementById('textInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const styleSelect = document.getElementById('styleSelect');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadBtn = document.getElementById('downloadBtn');

        // Character count update
        textInput.addEventListener('input', () => {
            document.getElementById('charCount').innerText = `${textInput.value.length} / 5000 characters`;
        });

        // Function to convert PCM to WAV (Required for Browser playback)
        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);

            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);

            let offset = 44;
            for (let i = 0; i < pcmData.length; i++) {
                view.setInt16(offset, pcmData[i], true);
                offset += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function generateSpeech(retryCount = 0) {
            const text = textInput.value.trim();
            if (!text) return;

            // UI Loading state
            generateBtn.disabled = true;
            btnText.innerText = "Processing...";
            btnLoader.classList.remove('hidden');
            audioContainer.classList.add('hidden');

            const voice = voiceSelect.value;
            const style = styleSelect.value;
            
            // Crafting natural instruction based on UI
            const prompt = `Say in a ${style} style: ${text}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: {
                                voiceName: voice
                            }
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                
                if (!response.ok) throw new Error(result.error?.message || 'Generation failed');

                const audioPart = result.candidates[0].content.parts[0].inlineData;
                const binaryString = atob(audioPart.data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                const pcm16Data = new Int16Array(bytes.buffer);
                const wavBlob = pcmToWav(pcm16Data, 24000);
                const audioUrl = URL.createObjectURL(wavBlob);

                // Update UI with audio
                audioPlayer.src = audioUrl;
                audioContainer.classList.remove('hidden');
                audioContainer.classList.add('flex');
                
                downloadBtn.onclick = () => {
                    const a = document.createElement('a');
                    a.href = audioUrl;
                    a.download = `voice-studio-${Date.now()}.wav`;
                    a.click();
                };

            } catch (error) {
                console.error(error);
                if (retryCount < 5) {
                    const delay = Math.pow(2, retryCount) * 1000;
                    setTimeout(() => generateSpeech(retryCount + 1), delay);
                } else {
                    alert("Error: " + error.message);
                }
            } finally {
                generateBtn.disabled = false;
                btnText.innerText = "Generate Audio";
                btnLoader.classList.add('hidden');
            }
        }

        generateBtn.addEventListener('click', () => generateSpeech());
    </script>
</body>
</html>
