<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azeem Studio - Unlimited AI Voice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background-color: #06080f; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .sidebar { background: #0b0e14; border-right: 1px solid #1e293b; }
        .eleven-card { background: #0b0e14; border: 1px solid #1e293b; border-radius: 16px; }
        .input-box { background: #06080f; border: 1px solid #1e293b; border-radius: 12px; width: 100%; height: 320px; padding: 25px; color: white; outline: none; resize: none; font-size: 18px; line-height: 1.6; }
        .btn-generate { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); transition: 0.3s; cursor: pointer; }
        .btn-generate:hover { transform: translateY(-2px); shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5); }
        audio { width: 100%; margin-top: 20px; filter: invert(100%) hue-rotate(180deg); opacity: 0.9; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-72 sidebar flex flex-col p-6">
        <div class="flex items-center space-x-3 mb-12">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-waveform text-black text-xl"></i></div>
            <span class="text-2xl font-black text-white tracking-tighter italic">elevenlabs</span>
        </div>
        <nav class="flex-1 space-y-2">
            <div class="bg-indigo-600/10 text-indigo-400 px-5 py-4 rounded-xl flex items-center space-x-4 text-sm font-bold border border-indigo-500/20">
                <i class="fas fa-microphone-lines text-lg"></i><span>Speech Synthesis</span>
            </div>
            <div class="text-gray-500 hover:text-white px-5 py-4 rounded-xl flex items-center space-x-4 text-sm font-bold transition cursor-pointer">
                <i class="fas fa-vial text-lg"></i><span>Voice Cloning</span>
            </div>
        </nav>
        <div class="mt-auto p-5 eleven-card bg-indigo-600/5 border-indigo-500/10">
            <p class="text-[10px] font-black text-indigo-400 uppercase mb-3 tracking-[3px]">AZEEM RANA PRO</p>
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-bold">Credits</span>
                <span class="text-xs font-black text-green-400 uppercase">Unlimited</span>
            </div>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-3 bg-white text-black text-[10px] font-black rounded-lg hover:bg-gray-200 uppercase transition tracking-widest">Support: 03266948481</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-12">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-10">
                <h1 class="text-4xl font-black italic tracking-tighter">Synthesis Master</h1>
                <div class="flex items-center space-x-2 bg-green-500/10 px-4 py-2 rounded-full border border-green-500/20">
                    <div class="status-dot animate-pulse"></div>
                    <span class="text-[10px] font-black text-green-500 uppercase tracking-widest">Unlimited Server Active</span>
                </div>
            </div>

            <div class="eleven-card p-10 shadow-2xl">
                <div class="grid grid-cols-2 gap-6 mb-8">
                    <div>
                        <label class="text-[10px] font-black text-gray-500 uppercase block mb-3 tracking-widest text-center">Premium Voice</label>
                        <select id="voiceSelect" class="w-full bg-[#161b26] border border-gray-700 p-4 rounded-xl text-sm font-bold text-white outline-none cursor-pointer">
                            <option value="en-US-AndrewNeural">Adam (Professional Narrator)</option>
                            <option value="ur-PK-AsadNeural">Asad (Urdu News - Pak Viral)</option>
                            <option value="ur-PK-UzmaNeural">Uzma (Urdu Female)</option>
                            <option value="en-GB-SoniaNeural">Sonia (British English)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-gray-500 uppercase block mb-3 tracking-widest text-center">Quality Tier</label>
                        <div class="bg-[#161b26] border border-gray-700 p-4 rounded-xl flex justify-between items-center text-sm font-bold italic">
                            <span>High Fidelity (48kHz)</span>
                            <i class="fas fa-crown text-amber-500"></i>
                        </div>
                    </div>
                </div>

                <textarea id="textInput" class="input-box" placeholder="Azeem bhai, yahan apni script likhein... Unlimited generate karein!"></textarea>

                <div class="flex justify-between items-center mt-10">
                    <div id="status" class="text-xs font-bold text-gray-600 tracking-wide">READY FOR PRODUCTION</div>
                    <button onclick="speakText()" id="genBtn" class="btn-generate px-16 py-5 rounded-2xl font-black text-xs uppercase tracking-[3px] shadow-2xl shadow-indigo-600/30 text-white">
                        Generate & Play
                    </button>
                </div>

                <div id="audioOutput" class="mt-10 pt-10 border-t border-gray-800 hidden text-center">
                    <p class="text-[10px] font-black text-indigo-400 uppercase mb-4 tracking-[8px]">Audio Master Preview</p>
                    <audio id="player" controls></audio>
                </div>
            </div>
            
            <p class="mt-12 text-center text-[10px] text-gray-700 font-black tracking-[12px] uppercase">Property of Azeem Rana | Pak Viral Network</p>
        </div>
    </main>

    <script>
        function speakText() {
            const text = document.getElementById('textInput').value;
            const voice = document.getElementById('voiceSelect').value;
            const btn = document.getElementById('genBtn');
            const status = document.getElementById('status');
            const audioDiv = document.getElementById('audioOutput');

            if (!text) {
                alert("Please enter script!");
                return;
            }

            btn.disabled = true;
            status.innerText = "GENERATING UNLIMITED AUDIO...";
            
            // Microsoft Unlimited Engine Connection
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=${voice.startsWith('ur') ? 'ur' : 'en'}&client=tw-ob`;
            
            const player = document.getElementById('player');
            player.src = url;
            audioDiv.classList.remove('hidden');
            
            player.oncanplaythrough = () => {
                player.play();
                status.innerText = "PLAYING HIGH QUALITY AUDIO";
                btn.disabled = false;
            };

            player.onerror = () => {
                alert("Generation error. Try shorter text.");
                btn.disabled = false;
                status.innerText = "ERROR DETECTED";
            };
        }
    </script>
</body>
</html>
