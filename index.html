<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Multi-Engine Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;700&display=swap');
        body { background: #030508; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass-sidebar { background: rgba(10, 15, 25, 0.8); backdrop-filter: blur(10px); border-right: 1px solid #1e293b; }
        .neon-btn { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); transition: 0.4s; }
        .neon-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5); }
        .input-box { background: #0f172a; border: 1px solid #334155; border-radius: 20px; transition: 0.3s; }
        .input-box:focus { border-color: #6366f1; box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-72 glass-sidebar flex flex-col p-8">
        <div class="mb-12">
            <h1 style="font-family: 'Orbitron';" class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400 leading-none">AZEEM STUDIO</h1>
            <p class="text-[8px] tracking-[4px] text-gray-500 mt-2 font-bold uppercase">Pak Viral Network</p>
        </div>
        
        <nav class="flex-1 space-y-4">
            <button onclick="showTab('tts')" class="w-full flex items-center space-x-4 p-4 rounded-xl hover:bg-white/5 transition font-bold text-sm">
                <i class="fas fa-wave-square text-indigo-500"></i><span>Pro Synthesis</span>
            </button>
            <button onclick="showTab('clone')" class="w-full flex items-center space-x-4 p-4 rounded-xl hover:bg-white/5 transition font-bold text-sm">
                <i class="fas fa-fingerprint text-purple-500"></i><span>Instant Cloning</span>
            </button>
        </nav>

        <div class="mt-auto bg-indigo-950/20 p-5 rounded-2xl border border-indigo-500/20">
            <p class="text-[10px] text-indigo-300 font-bold mb-3 uppercase">JazzCash: 0326 6948481</p>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-3 bg-white text-black text-[10px] font-black rounded-lg uppercase">Contact Azeem</button>
        </div>
    </aside>

    <main class="flex-1 p-16 overflow-y-auto">
        <div id="tts-section">
            <div class="flex justify-between items-end mb-10">
                <div>
                    <h2 class="text-4xl font-black italic uppercase tracking-tighter">Voice Synthesis</h2>
                    <p class="text-gray-500 text-sm mt-2">Professional Urdu & English Voices</p>
                </div>
                <div class="text-right">
                    <span class="text-[10px] font-bold text-green-500 border border-green-500/30 px-3 py-1 rounded-full uppercase">Engine: Premium Multilingual</span>
                </div>
            </div>

            <textarea id="scriptInput" class="input-box w-full h-64 p-8 text-xl outline-none mb-8" placeholder="Azeem bhai, apna news script yahan likhein..."></textarea>

            <div class="flex items-center space-x-4">
                <select id="voiceId" class="input-box p-5 rounded-2xl text-white font-bold w-80 outline-none appearance-none">
                    <option value="pNInz6obpgDQGcFmaJgB">Adam (Deep Male News)</option>
                    <option value="erXw7eAyq3QCqU2jt0pA">Antoni (Urdu Soft)</option>
                    <option value="21m00Tcm4labaLutUeXy">Bella (Professional Female)</option>
                    <option id="userClone" value="" disabled>My Real Voice (Upload First)</option>
                </select>
                <button onclick="generateAudio()" id="mainBtn" class="neon-btn px-12 py-5 rounded-2xl font-black text-xs uppercase tracking-widest text-white">Generate Voice</button>
                <a id="downloadBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 px-8 py-5 rounded-2xl font-black text-xs uppercase transition-all">Download MP3</a>
            </div>
            <div id="log" class="mt-8 text-[10px] text-gray-600 font-bold uppercase tracking-widest">System Ready</div>
        </div>

        <div id="clone-section" class="hidden text-center py-20">
            <div class="max-w-2xl mx-auto bg-white/5 border border-white/10 p-16 rounded-[40px] border-dashed">
                <i class="fas fa-cloud-upload-alt text-6xl text-indigo-500 mb-8"></i>
                <h3 class="text-3xl font-black mb-4 italic uppercase">Clone Your Voice</h3>
                <p class="text-gray-400 mb-10 text-sm uppercase font-bold tracking-widest">Upload 1 minute of clear speech (No Background Noise)</p>
                <input type="file" id="voiceUpload" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('voiceUpload').click()" class="bg-indigo-600 px-16 py-6 rounded-2xl font-black uppercase text-xs hover:bg-indigo-500 transition">Select Voice Sample</button>
                <div id="cloneLog" class="mt-8 text-purple-400 font-bold text-xs uppercase tracking-widest"></div>
            </div>
        </div>
    </main>

    <script>
        const API_KEY = "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f";

        function showTab(tab) {
            document.getElementById('tts-section').classList.toggle('hidden', tab !== 'tts');
            document.getElementById('clone-section').classList.toggle('hidden', tab !== 'clone');
        }

        document.getElementById('voiceUpload').onchange = async function(e) {
            const status = document.getElementById('cloneLog');
            status.innerText = "Analyzing Frequencies & Cloning...";
            
            const formData = new FormData();
            formData.append('name', 'Azeem_Real_Clone');
            formData.append('files', e.target.files[0]);

            try {
                const res = await fetch('https://api.elevenlabs.io/v1/voices/add', {
                    method: 'POST',
                    headers: { 'xi-api-key': API_KEY },
                    body: formData
                });
                const data = await res.json();
                
                const opt = document.getElementById('userClone');
                opt.value = data.voice_id;
                opt.disabled = false;
                opt.selected = true;
                opt.innerText = "MY REAL VOICE (ACTIVE)";
                
                status.innerText = "SUCCESS! YOUR VOICE IS READY IN THE DROPDOWN.";
                setTimeout(() => showTab('tts'), 2000);
            } catch (err) {
                status.innerText = "QUOTA ERROR! PLEASE USE NEW API KEY.";
            }
        };

        async function generateAudio() {
            const text = document.getElementById('scriptInput').value;
            const vId = document.getElementById('voiceId').value;
            const btn = document.getElementById('mainBtn');
            const log = document.getElementById('log');

            if(!text) return alert("Pehle script likhein!");
            btn.innerText = "Generating...";
            log.innerText = "Connecting to Premium Engine...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vId}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.4, similarity_boost: 0.9, use_speaker_boost: true }
                    })
                });

                if(!response.ok) throw new Error();

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                audio.play();

                const dl = document.getElementById('downloadBtn');
                dl.href = url;
                dl.download = "Azeem_Studio_Voice.mp3";
                dl.classList.remove('hidden');
                btn.innerText = "Generate Voice";
                log.innerText = "Success: Audio Synthesized!";
            } catch (err) {
                alert("Quota khatam ho gaya Azeem bhai! Nayi key use karein.");
                btn.innerText = "Generate Voice";
            }
        }
    </script>
</body>
</html>
