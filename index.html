YPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO - Voice AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .loader { border-top-color: #6366f1; animation: spinner 0.6s linear infinite; }
        @keyframes spinner { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <header class="w-full max-w-2xl flex items-center justify-center gap-3 my-10">
        <div class="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-2xl shadow-xl">A</div>
        <h1 class="text-3xl font-extrabold tracking-tight">AZEEM STUDIO</h1>
    </header>

    <main class="w-full max-w-2xl glass rounded-3xl p-8 shadow-2xl">
        <div class="mb-6">
            <label class="block text-sm font-medium text-slate-400 mb-2">Select Voice</label>
            <select id="voiceSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="Kore">Kore (Standard)</option>
                <option value="Zephyr">Zephyr (Deep)</option>
                <option value="Puck">Puck (Happy)</option>
                <option value="Charon">Charon (Storyteller)</option>
            </select>
        </div>

        <div class="mb-8">
            <label class="block text-sm font-medium text-slate-400 mb-2">Aapka Text</label>
            <textarea id="textInput" class="w-full h-40 bg-slate-800 border border-slate-700 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-indigo-500 text-lg resize-none">Azeem Studio mein aapka swagat hai. Aaj hum AI voice test kar rahe hain.</textarea>
        </div>

        <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 py-4 rounded-2xl font-bold text-xl transition-all active:scale-95 flex items-center justify-center gap-3">
            <span id="btnText">Generate Voice</span>
            <div id="btnLoader" class="hidden loader w-6 h-6 border-2 border-white rounded-full"></div>
        </button>

        <div id="status" class="mt-4 text-center text-sm"></div>

        <div id="resultArea" class="hidden mt-8 p-6 bg-slate-900/50 rounded-2xl border border-slate-700">
            <audio id="audioPlayer" controls class="w-full mb-4"></audio>
            <a id="downloadLink" class="block text-center text-indigo-400 font-semibold hover:underline">Download Audio</a>
        </div>
    </main>

    <script>
        const apiKey = "";
        const model = "gemini-2.5-flash-preview-09-2025";
        
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const btnLoader = document.getElementById('btnLoader');
        const status = document.getElementById('status');
        const resultArea = document.getElementById('resultArea');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');

        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function startGeneration(retries = 5) {
            const text = document.getElementById('textInput').value.trim();
            if(!text) return;

            generateBtn.disabled = true;
            btnLoader.classList.remove('hidden');
            btnText.innerText = "Processing...";
            status.innerText = "";
            resultArea.classList.add('hidden');

            const payload = {
                contents: [{ parts: [{ text: `Say this exactly: ${text}` }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            prebuiltVoiceConfig: { 
                                voiceName: document.getElementById('voiceSelect').value 
                            }
                        }
                    }
                }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error?.message || "Connection failed");
                }

                const data = await response.json();
                const audioData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;

                if (!audioData) throw new Error("No audio returned. Try again.");

                const binary = atob(audioData);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                
                const pcm16 = new Int16Array(bytes.buffer);
                const wavBlob = pcmToWav(pcm16, 24000);
                const url = URL.createObjectURL(wavBlob);

                audioPlayer.src = url;
                downloadLink.href = url;
                downloadLink.download = "azeem-studio-audio.wav";
                resultArea.classList.remove('hidden');
                audioPlayer.play();
                status.innerHTML = "<span class='text-green-400'>Voice Generated Successfully!</span>";

            } catch (err) {
                console.error(err);
                if (retries > 0) {
                    status.innerText = `Retrying... (${6-retries}/5)`;
                    setTimeout(() => startGeneration(retries - 1), 2000);
                } else {
                    status.innerHTML = `<span class='text-red-400'>Error: ${err.message}</span>`;
                }
            } finally {
                if (retries === 0 || !resultArea.classList.contains('hidden')) {
                    generateBtn.disabled = false;
                    btnLoader.classList.add('hidden');
                    btnText.innerText = "Generate Voice";
                }
            }
        }

        generateBtn.onclick = () => startGeneration();
    </script>
</body>
</html>
