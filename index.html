<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO PRO | Real Voice & Cloning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #05070a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .input-area { background: #0c0f16; border: 1px solid #1e293b; border-radius: 20px; width: 100%; height: 300px; padding: 25px; color: white; outline: none; resize: none; font-size: 18px; }
        .active-tab { background: linear-gradient(90deg, #4f46e5 0%, transparent 100%); border-left: 4px solid #818cf8; color: white; }
        .btn-gen { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); transition: 0.3s; cursor: pointer; }
        .btn-gen:hover { transform: scale(1.02); }
        .download-btn { background: #10b981; transition: 0.3s; display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 glass flex flex-col p-6">
        <div class="mb-10 px-2">
            <h1 class="text-3xl font-black italic text-white tracking-tighter">AZEEM STUDIO</h1>
            <p class="text-[9px] font-bold text-indigo-400 tracking-[4px] uppercase">Pak Viral Network</p>
        </div>

        <nav class="flex-1 space-y-2">
            <div onclick="showTab('synthesis')" id="nav-syn" class="active-tab px-5 py-4 flex items-center space-x-4 cursor-pointer rounded-r-xl transition font-bold">
                <i class="fas fa-microphone-alt"></i><span>Speech Synthesis</span>
            </div>
            <div onclick="showTab('cloning')" id="nav-clo" class="px-5 py-4 flex items-center space-x-4 cursor-pointer rounded-xl text-gray-500 hover:text-white transition font-bold">
                <i class="fas fa-vial"></i><span>Voice Cloning Pro</span>
            </div>
        </nav>

        <div class="mt-auto p-5 rounded-2xl bg-indigo-600/10 border border-indigo-500/20">
            <p class="text-[10px] font-black text-indigo-300 uppercase mb-2">JazzCash: 0326 6948481</p>
            <div class="flex justify-between items-center mb-3"><span class="text-xs font-bold">Limit:</span><span class="text-xs font-black text-green-400">3000 WORDS</span></div>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-3 bg-white text-black text-[10px] font-black rounded-lg uppercase">Contact AZEEM RANA</button>
        </div>
    </aside>

    <main class="flex-1 p-12 overflow-y-auto">
        
        <div id="tab-synthesis">
            <h2 class="text-4xl font-black italic mb-8 text-white uppercase tracking-tighter">Real Voice Synthesis</h2>
            <textarea id="textInput" maxlength="3000" class="input-area mb-6" placeholder="Azeem bhai, apni 3000 words tak ki script likhein..."></textarea>
            
            <div class="flex space-x-4 items-center mb-8">
                <select id="voiceSelect" class="bg-[#0c0f16] border border-gray-800 p-4 rounded-xl text-indigo-400 font-bold w-64">
                    <option value="pNInz6obpgDQGcFmaJgB">Adam (Real Male)</option>
                    <option value="EXAVITQu4vr4xnSDxMaL">Bella (Real Female)</option>
                    <option value="MF3mGyEYCl7XYW795STf">Rachel (Professional)</option>
                    <option value="ErXwbc381Jm6BneGrI7f">Antoni (Deep Voice)</option>
                </select>
                <button onclick="generateAudio()" id="genBtn" class="btn-gen px-12 py-4 rounded-xl text-xs font-black uppercase text-white">Generate Audio</button>
                <a id="downloadLink" class="download-btn px-12 py-4 rounded-xl text-xs font-black uppercase text-white no-underline">
                    <i class="fas fa-download mr-2"></i>Download
                </a>
            </div>
            <div id="audioPlayerContainer" class="hidden">
                <audio id="mainAudio" controls class="w-full"></audio>
            </div>
        </div>

        <div id="tab-cloning" class="hidden">
            <h2 class="text-4xl font-black italic mb-8 text-white uppercase tracking-tighter">Instant Cloning</h2>
            <div class="bg-[#0c0f16] border-2 border-dashed border-indigo-500/20 p-16 rounded-[40px] text-center">
                <i class="fas fa-cloud-upload-alt text-5xl text-indigo-500 mb-6"></i>
                <h3 class="text-xl font-bold mb-4 text-white">Upload Your Voice</h3>
                <p class="text-gray-500 italic mb-8">Upload 1 min audio. Noise removal is active.</p>
                <input type="file" id="voiceFile" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('voiceFile').click()" class="bg-indigo-600 px-8 py-3 rounded-lg font-bold text-xs">SELECT FILE</button>
                <div id="fileName" class="mt-4 text-indigo-400 text-xs font-bold"></div>
            </div>
        </div>
    </main>

    <script>
        const API_KEY = "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f";

        function showTab(tab) {
            document.getElementById('tab-synthesis').classList.toggle('hidden', tab !== 'synthesis');
            document.getElementById('tab-cloning').classList.toggle('hidden', tab !== 'cloning');
            document.getElementById('nav-syn').classList.toggle('active-tab', tab === 'synthesis');
            document.getElementById('nav-clo').classList.toggle('active-tab', tab === 'cloning');
        }

        document.getElementById('voiceFile').onchange = function() {
            document.getElementById('fileName').innerText = "Uploaded: " + this.files[0].name;
        };

        async function generateAudio() {
            const text = document.getElementById('textInput').value;
            const voiceId = document.getElementById('voiceSelect').value;
            const btn = document.getElementById('genBtn');
            const dlBtn = document.getElementById('downloadLink');

            if(!text) return alert("Pehle text likhen!");
            btn.innerText = "Processing...";
            dlBtn.style.display = "none";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.8 }
                    })
                });

                if (!response.ok) throw new Error("Quota Error");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                // Audio Player & Play
                const audio = document.getElementById('mainAudio');
                audio.src = url;
                document.getElementById('audioPlayerContainer').classList.remove('hidden');
                audio.play();

                // Download Button Setup
                dlBtn.href = url;
                dlBtn.download = "Azeem_Studio_Audio.mp3";
                dlBtn.style.display = "inline-block";

            } catch (e) {
                alert("Quota issue! Please check ElevenLabs balance.");
            } finally {
                btn.innerText = "Generate Audio";
            }
        }
    </script>
</body>
</html>
