<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO MAX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap');
        body { background: #02040a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .sidebar { background: #0a0e17; border-right: 1px solid #1e293b; }
        .studio-card { background: #0f172a; border: 1px solid #334155; border-radius: 24px; }
        .neon-glow { text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        .btn-pro { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); transition: 0.3s; }
        .btn-pro:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px #6366f1; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 sidebar flex flex-col p-8">
        <div class="mb-10">
            <h1 style="font-family: 'Orbitron';" class="text-2xl font-black text-indigo-500 italic neon-glow leading-none">AZEEM STUDIO</h1>
            <p class="text-[9px] font-bold text-gray-500 tracking-[3px] uppercase mt-2">Pak Viral Network</p>
        </div>
        
        <nav class="flex-1 space-y-3">
            <div onclick="showTab('tts')" class="flex items-center space-x-4 p-4 rounded-xl bg-indigo-600/10 border-l-4 border-indigo-500 cursor-pointer text-sm font-bold">
                <i class="fas fa-microphone"></i><span>Pro Synthesis</span>
            </div>
            <div onclick="showTab('clone')" class="flex items-center space-x-4 p-4 rounded-xl hover:bg-white/5 cursor-pointer text-sm font-bold text-gray-400 hover:text-white">
                <i class="fas fa-id-badge"></i><span>Ultimate Clone</span>
            </div>
        </nav>

        <div class="mt-auto studio-card p-6 border-indigo-500/20">
            <p class="text-[10px] text-indigo-400 font-black mb-2 uppercase tracking-tighter text-center">Support: 0326 6948481</p>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-3 bg-white text-black text-[10px] font-black rounded-lg uppercase">Contact Azeem Rana</button>
        </div>
    </aside>

    <main class="flex-1 p-16 overflow-y-auto bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-indigo-900/10 via-transparent to-transparent">
        
        <div id="tts-view">
            <div class="mb-12">
                <h2 class="text-5xl font-black italic uppercase tracking-tighter mb-2">Synthesis Lab</h2>
                <span class="bg-indigo-500/20 text-indigo-400 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Multi-Engine Active</span>
            </div>

            <textarea id="scriptBox" class="studio-card w-full h-72 p-8 text-xl outline-none mb-8 focus:border-indigo-500 transition-all shadow-2xl" placeholder="Azeem bhai, news script paste karein..."></textarea>

            <div class="flex items-center space-x-6">
                <select id="vSelect" class="studio-card p-5 rounded-2xl text-white font-bold w-80 outline-none">
                    <option value="pNInz6obpgDQGcFmaJgB">Adam (Deep Professional)</option>
                    <option value="erXw7eAyq3QCqU2jt0pA">Antoni (Urdu Specialist)</option>
                    <option value="21m00Tcm4labaLutUeXy">Bella (News Female)</option>
                    <option id="userVoice" value="" disabled>My Real Voice (Not Cloned)</option>
                </select>
                <button onclick="generate()" id="genBtn" class="btn-pro px-14 py-5 rounded-2xl text-[11px] font-black uppercase text-white tracking-widest">Generate & Play</button>
                <a id="dlLink" class="hidden bg-green-600 hover:bg-green-500 px-10 py-5 rounded-2xl text-[11px] font-black uppercase transition-all shadow-lg">Download</a>
            </div>
            <div id="status" class="mt-8 text-[10px] text-gray-600 font-bold uppercase tracking-[2px]">Ready for Action</div>
        </div>

        <div id="clone-view" class="hidden">
            <h2 class="text-5xl font-black italic uppercase tracking-tighter mb-12">Instant Clone</h2>
            <div class="studio-card border-dashed border-2 border-indigo-500/30 p-20 text-center rounded-[40px]">
                <i class="fas fa-cloud-upload-alt text-6xl text-indigo-500 mb-6"></i>
                <h3 class="text-2xl font-bold mb-4 uppercase">Upload Your Sample</h3>
                <input type="file" id="fInput" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('fInput').click()" class="bg-indigo-600 px-12 py-5 rounded-2xl font-black uppercase text-[11px] hover:bg-indigo-500 transition-all">Select Audio File</button>
                <div id="cLog" class="mt-8 text-indigo-400 font-black text-xs uppercase tracking-widest"></div>
            </div>
        </div>
    </main>

    <script>
        const KEY = "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f";

        function showTab(t) {
            document.getElementById('tts-view').classList.toggle('hidden', t !== 'tts');
            document.getElementById('clone-view').classList.toggle('hidden', t !== 'clone');
        }

        document.getElementById('fInput').onchange = async (e) => {
            const log = document.getElementById('cLog');
            log.innerText = "Processing High-Quality Clone...";
            
            const fd = new FormData();
            fd.append('name', 'Azeem_Pro_Clone');
            fd.append('files', e.target.files[0]);

            try {
                const res = await fetch('https://api.elevenlabs.io/v1/voices/add', {
                    method: 'POST',
                    headers: { 'xi-api-key': KEY },
                    body: fd
                });
                const d = await res.json();
                const v = document.getElementById('userVoice');
                v.value = d.voice_id;
                v.disabled = false;
                v.selected = true;
                v.innerText = "MY REAL VOICE (ACTIVE)";
                log.innerText = "CLONE SUCCESSFUL! READY TO USE.";
                setTimeout(() => showTab('tts'), 1500);
            } catch (err) {
                log.innerText = "QUOTA ERROR! TRY NEW API KEY.";
            }
        };

        async function generate() {
            const t = document.getElementById('scriptBox').value;
            const v = document.getElementById('vSelect').value;
            const b = document.getElementById('genBtn');
            const s = document.getElementById('status');

            if(!t) return alert("Pehle script likhein!");
            b.innerText = "GENERATING...";
            s.innerText = "Accessing Premium Engine...";

            try {
                const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${v}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: t,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.45, similarity_boost: 0.95 }
                    })
                });

                if(!res.ok) throw new Error();

                const bl = await res.blob();
                const u = URL.createObjectURL(bl);
                new Audio(u).play();

                const dl = document.getElementById('dlLink');
                dl.href = u;
                dl.download = "Azeem_Studio_Pro.mp3";
                dl.classList.remove('hidden');
                b.innerText = "Generate & Play";
                s.innerText = "AUDIO READY!";
            } catch (err) {
                alert("Quota issue Azeem bhai! Nayi key daalein.");
                b.innerText = "Generate & Play";
            }
        }
    </script>
</body>
</html>
