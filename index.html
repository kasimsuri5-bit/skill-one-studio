<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Akool AI Powered</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #050505; color: #f0f0f0; font-family: 'Inter', sans-serif; }
        .sidebar { background: #0a0a0a; border-right: 1px solid #1a1a1a; min-height: 100vh; }
        .akool-card { background: #111111; border: 1px solid #222; border-radius: 20px; transition: 0.3s; }
        .akool-card:hover { border-color: #6366f1; }
        .btn-akool { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-weight: 800; transition: 0.3s; }
        .btn-akool:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .nav-link { color: #888; font-weight: 600; padding: 12px; border-radius: 10px; transition: 0.2s; }
        .nav-link.active { background: #1a1a1a; color: #fff; }
    </style>
</head>
<body class="flex">

    <div class="w-72 sidebar p-8 hidden md:flex flex-col">
        <div class="mb-12">
            <h1 class="text-3xl font-black italic tracking-tighter text-white">AZEEM STUDIO</h1>
            <p class="text-[10px] text-indigo-500 font-bold tracking-[4px] uppercase mt-1">Akool AI Integrated</p>
        </div>

        <nav class="flex-1 space-y-3">
            <div class="nav-link active flex items-center gap-4">
                <i class="fas fa-video text-indigo-400"></i>
                <span>Akool Video Lab</span>
            </div>
            <div class="nav-link flex items-center gap-4">
                <i class="fas fa-user-astronaut"></i>
                <span>Digital Avatar</span>
            </div>
            <div class="nav-link flex items-center gap-4">
                <i class="fas fa-magic"></i>
                <span>Face Swap Pro</span>
            </div>
        </nav>

        <div class="mt-auto p-4 akool-card bg-indigo-950/10 border-indigo-900/30">
            <p class="text-[9px] text-gray-500 font-bold mb-2 uppercase tracking-widest text-center italic">Azeem Rana Exclusive</p>
            <button class="w-full bg-white text-black text-[11px] font-black py-3 rounded-lg uppercase shadow-lg">0326 6948481</button>
        </div>
    </div>

    <main class="flex-1 p-8 md:p-16 overflow-y-auto">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-center mb-12">
                <h2 class="text-6xl font-black italic tracking-tighter uppercase">Akool Lab</h2>
                <div class="flex gap-2">
                    <span class="bg-indigo-500/20 text-indigo-400 text-[10px] font-bold px-4 py-2 rounded-full border border-indigo-500/20 uppercase tracking-widest italic">PAK VIRAL Engine</span>
                </div>
            </div>

            <div class="akool-card p-8 mb-8 shadow-2xl">
                <div class="flex items-center gap-3 mb-4 text-gray-500">
                    <i class="fas fa-keyboard"></i>
                    <span class="text-xs font-bold uppercase tracking-widest">Input Your Script</span>
                </div>
                <textarea id="script" class="w-full h-80 bg-transparent text-gray-200 text-2xl leading-relaxed outline-none resize-none" placeholder="Azeem bhai, Akool AI ke liye script yahan likhein..."></textarea>
            </div>

            <div class="flex flex-col md:flex-row gap-6 items-center">
                <div class="w-full md:w-1/3">
                    <select id="avatar" class="w-full bg-[#111] border border-[#333] p-5 rounded-2xl font-bold text-white outline-none focus:border-indigo-500 transition-all cursor-pointer appearance-none">
                        <option value="male_01">Akool News Avatar (Male)</option>
                        <option value="female_01">Akool News Avatar (Female)</option>
                        <option value="custom">Custom Face Swap</option>
                    </select>
                </div>

                <button onclick="startAkoolProcess()" id="btn" class="w-full md:flex-1 btn-akool py-5 rounded-2xl text-white uppercase tracking-[4px] text-sm flex items-center justify-center gap-4">
                    <i class="fas fa-rocket"></i>
                    <span>Generate Akool Content</span>
                </button>
            </div>

            <div id="status" class="mt-8 text-center text-[10px] font-bold text-gray-600 tracking-[5px] uppercase">Engine Status: Waiting for Akool Token...</div>

            <div id="result" class="mt-12 hidden akool-card p-10 border-indigo-500/30 bg-indigo-900/5 text-center">
                <div class="flex flex-col items-center gap-6">
                    <div class="w-20 h-20 bg-indigo-500/20 rounded-full flex items-center justify-center animate-bounce">
                        <i class="fas fa-check text-3xl text-indigo-500"></i>
                    </div>
                    <h3 class="text-2xl font-bold uppercase italic">Content Generated!</h3>
                    <div class="flex gap-4">
                        <button class="bg-indigo-600 px-8 py-3 rounded-xl font-bold hover:bg-indigo-500 transition-all">Preview Video</button>
                        <button class="bg-white text-black px-8 py-3 rounded-xl font-bold hover:bg-gray-200 transition-all">Download 4K</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Akool AI Token yahan paste hoga
        const AKOOL_TOKEN = "PASTE_YOUR_AKOOL_TOKEN_HERE";

        async function startAkoolProcess() {
            const script = document.getElementById('script').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if(!script) {
                alert("Azeem bhai, Akool ke liye script zaroori hai!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-sync fa-spin"></i> <span>Processing Akool AI...</span>`;
            status.innerText = "Akool Engine Processing Your Request...";

            // Yahan Akool ki API ka fetch logic lagega
            setTimeout(() => {
                document.getElementById('result').classList.remove('hidden');
                status.innerText = "Success: Content Ready to Download!";
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-rocket"></i> <span>Generate Akool Content</span>`;
            }, 3000);
        }
    </script>
</body>
</html>
