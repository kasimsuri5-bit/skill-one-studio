<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Pro Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;700&display=swap');
        body { background: #010203; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.9); border: 1px solid #1e293b; backdrop-filter: blur(12px); border-radius: 30px; }
        .neon-text { text-shadow: 0 0 15px rgba(99, 102, 241, 0.6); }
        .action-btn { background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .action-btn:hover { transform: scale(1.02) translateY(-2px); box-shadow: 0 12px 24px -10px #6366f1; }
        .input-field { background: #0f172a; border: 1px solid #334155; border-radius: 20px; transition: 0.3s; color: white; }
        .input-field:focus { border-color: #818cf8; outline: none; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-[#080c14] border-right border-[#1e293b] flex flex-col p-8">
        <div class="mb-12">
            <h1 style="font-family: 'Orbitron';" class="text-3xl font-black text-indigo-500 italic neon-text leading-none">AZEEM STUDIO</h1>
            <p class="text-[9px] font-bold text-gray-500 tracking-[4px] uppercase mt-3">Pak Viral Network</p>
        </div>
        
        <nav class="flex-1 space-y-4">
            <button onclick="switchTab('tts')" class="w-full flex items-center space-x-4 p-5 rounded-2xl bg-indigo-600/10 border-l-4 border-indigo-500 text-sm font-bold tracking-tight">
                <i class="fas fa-wave-square text-indigo-400"></i><span>Multi-Voice Synthesis</span>
            </button>
            <button onclick="switchTab('clone')" class="w-full flex items-center space-x-4 p-5 rounded-2xl hover:bg-white/5 text-sm font-bold text-gray-400 hover:text-white transition-all">
                <i class="fas fa-fingerprint text-purple-500"></i><span>Pro Voice Cloning</span>
            </button>
        </nav>

        <div class="mt-auto glass-panel p-6 border-indigo-500/20 text-center">
            <p class="text-[10px] text-indigo-400 font-black mb-3 uppercase tracking-widest">Azeem Rana Official</p>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-4 bg-white text-black text-[11px] font-black rounded-xl uppercase shadow-xl active:scale-95 transition-all">WhatsApp Support</button>
        </div>
    </aside>

    <main class="flex-1 p-16 overflow-y-auto bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-900/20 via-transparent to-transparent">
        
        <div id="tts-view" class="max-w-5xl">
            <div class="mb-12 flex justify-between items-end">
                <div>
                    <h2 class="text-5xl font-black italic uppercase tracking-tighter mb-2">Voice Lab</h2>
                    <p class="text-gray-400 font-bold text-xs uppercase tracking-[3px]">High-Fidelity AI Synthesis</p>
                </div>
                <div class="text-right pb-1">
                    <div class="flex items-center space-x-2 bg-green-500/10 border border-green-500/30 px-4 py-2 rounded-full">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-[10px] font-black text-green-500 uppercase">Engine Stable</span>
                    </div>
                </div>
            </div>

            <textarea id="scriptBox" class="input-field w-full h-80 p-10 text-2xl outline-none mb-10 shadow-2xl leading-relaxed" placeholder="Azeem bhai, apna documentary script yahan paste karein..."></textarea>

            <div class="flex items-center space-x-8">
                <div class="flex-1">
                    <label class="text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 block ml-1">Select Premium Voice</label>
                    <select id="voiceList" class="input-field w-full p-6 rounded-2xl text-white font-bold appearance-none cursor-pointer">
                        <option value="pNInz6obpgDQGcFmaJgB">Adam (Deep Male - News Style)</option>
                        <option value="erXw7eAyq3QCqU2jt0pA">Antoni (Urdu/Hindi Specialized)</option>
                        <option value="21m00Tcm4labaLutUeXy">Bella (Professional Female)</option>
                        <option value="EXAVITQu4vr4xnSDxMaL">Sarah (Soft Documentary)</option>
                        <option id="clonedVoice" value="" disabled>My Real Voice (Upload Sample First)</option>
                    </select>
                </div>
                <div class="flex flex-col space-y-4 pt-6">
                    <button onclick="processVoice()" id="processBtn" class="action-btn px-16 py-6 rounded-2xl text-[12px] font-black uppercase text-white tracking-widest shadow-2xl">Generate Audio</button>
                    <a id="downloadLink" class="hidden text-center bg-emerald-600 hover:bg-emerald-500 px-10 py-5 rounded-2xl text-[11px] font-black uppercase transition-all shadow-lg cursor-pointer">Download MP3</a>
                </div>
            </div>
            <div id="statusIndicator" class="mt-10 text-[10px] text-gray-600 font-bold uppercase tracking-[4px]">System: Ready for Synthesis</div>
        </div>

        <div id="clone-view" class="hidden max-w-4xl">
            <h2 class="text-5xl font-black italic uppercase tracking-tighter mb-12">Voice Cloning</h2>
            <div class="glass-panel border-dashed border-2 border-indigo-500/40 p-24 text-center">
                <div class="w-24 h-24 bg-indigo-500/10 rounded-full flex items-center justify-center mx-auto mb-8">
                    <i class="fas fa-microphone-alt text-4xl text-indigo-500"></i>
                </div>
                <h3 class="text-3xl font-bold mb-4 uppercase italic">Create Digital Twin</h3>
                <p class="text-gray-400 mb-12 text-sm font-bold tracking-widest max-w-md mx-auto leading-relaxed">Upload a clear 60-second audio clip for perfect cloning. Background noise will be removed automatically.</p>
                <input type="file" id="audioUpload" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('audioUpload').click()" class="action-btn px-14 py-6 rounded-2xl font-black uppercase text-[12px] tracking-widest">Select Audio Sample</button>
                <div id="cloningLog" class="mt-10 text-indigo-400 font-black text-xs uppercase tracking-widest animate-pulse"></div>
            </div>
        </div>
    </main>

    <script>
        const API_KEY = "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f";

        function switchTab(tab) {
            document.getElementById('tts-view').classList.toggle('hidden', tab !== 'tts');
            document.getElementById('clone-view').classList.toggle('hidden', tab !== 'clone');
        }

        document.getElementById('audioUpload').onchange = async (e) => {
            const log = document.getElementById('cloningLog');
            log.innerText = "Analyzing Vocal Frequencies...";
            
            const formData = new FormData();
            formData.append('name', 'Azeem_Global_Clone');
            formData.append('files', e.target.files[0]);

            try {
                const response = await fetch('https://api.elevenlabs.io/v1/voices/add', {
                    method: 'POST',
                    headers: { 'xi-api-key': API_KEY },
                    body: formData
                });
                const data = await response.json();
                const option = document.getElementById('clonedVoice');
                option.value = data.voice_id;
                option.disabled = false;
                option.selected = true;
                option.innerText = "MY REAL CLONE (READY)";
                log.innerText = "CLONING SUCCESSFUL! SYSTEM UPDATED.";
                setTimeout(() => switchTab('tts'), 2000);
            } catch (err) {
                log.innerText = "ERROR: QUOTA DEPLETED. CHECK ELEVENLABS BALANCE.";
            }
        };

        async function processVoice() {
            const text = document.getElementById('scriptBox').value;
            const voice = document.getElementById('voiceList').value;
            const btn = document.getElementById('processBtn');
            const status = document.getElementById('statusIndicator');

            if(!text) return alert("Pehle news script likhein!");
            btn.innerText = "SYNTHESIZING...";
            status.innerText = "Engine Status: Generating High-Resolution Audio...";

            try {
                const res = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.45, similarity_boost: 0.90, style: 0.5, use_speaker_boost: true }
                    })
                });

                if(!res.ok) throw new Error();

                const blob = await res.blob();
                const audioUrl = URL.createObjectURL(blob);
                const audioPlayer = new Audio(audioUrl);
                audioPlayer.play();

                const dl = document.getElementById('downloadLink');
                dl.href = audioUrl;
                dl.download = "Azeem_Pro_News.mp3";
                dl.classList.remove('hidden');
                btn.innerText = "Generate Audio";
                status.innerText = "Status: Audio Successfully Rendered!";
            } catch (err) {
                alert("Quota issue Azeem bhai! ElevenLabs ka balance check karein.");
                btn.innerText = "Generate Audio";
            }
        }
    </script>
</body>
</html>
