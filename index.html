<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Pak Viral Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #e6edf3; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; backdrop-filter: blur(10px); }
        .sidebar { background: #010409; border-right: 1px solid #30363d; }
        .active-tab { background: linear-gradient(90deg, #1f2937 0%, #111827 100%); border-left: 4px solid #3b82f6; color: #fff; }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="w-64 sidebar hidden md:flex flex-col p-6">
        <div class="mb-10">
            <h1 class="text-2xl font-black italic text-white tracking-tighter">AZEEM STUDIO</h1>
            <p class="text-[10px] text-blue-500 font-bold tracking-[2px] uppercase">Pak Viral Network</p>
        </div>
        
        <nav class="space-y-2">
            <div class="active-tab p-4 rounded-xl flex items-center gap-3 cursor-pointer">
                <i class="fas fa-microphone"></i>
                <span class="font-bold text-sm">Real Voice Synthesis</span>
            </div>
            <div class="p-4 rounded-xl flex items-center gap-3 text-gray-500 hover:bg-gray-800 transition-all cursor-not-allowed">
                <i class="fas fa-pen"></i>
                <span class="font-bold text-sm">Upload Real Voice</span>
            </div>
        </nav>

        <div class="mt-auto p-4 bg-blue-900/20 border border-blue-800/30 rounded-2xl">
            <p class="text-[10px] font-bold text-blue-400 mb-2 uppercase">JAZZCASH: 0326 6948481</p>
            <button class="w-full bg-white text-black text-xs font-black py-3 rounded-lg uppercase">Contact Azeem Rana</button>
        </div>
    </div>

    <div class="flex-1 p-5 md:p-12 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-5xl font-black italic text-white mb-10 tracking-tighter uppercase">AI Synthesis</h2>
            
            <div class="glass p-8 rounded-[40px] shadow-2xl relative">
                <textarea id="script" class="w-full h-80 bg-transparent text-gray-200 text-xl leading-relaxed outline-none resize-none" placeholder="Imran Khan ka janam Lahore ke ek madhyam vargiya parivar mein hua tha..."></textarea>
            </div>

            <div class="mt-8 flex flex-col md:flex-row gap-5">
                <select id="voice" class="flex-1 bg-[#161b22] border border-[#30363d] p-5 rounded-2xl font-bold text-white outline-none appearance-none">
                    <option value="pNInz6obpgDQGcFmaJgB">Adam (Professional Male)</option>
                    <option value="erXw7eAyq3QCqU2jt0pA">Antoni (Urdu Specialist)</option>
                    <option value="EXAVITQu4vr4xnSDxMaL">Sarah (News Female)</option>
                </select>

                <button onclick="generateAudio()" id="btn" class="bg-[#2d3393] hover:bg-[#3d44b5] px-12 py-5 rounded-2xl font-black uppercase tracking-widest text-sm transition-all shadow-lg">Generate Asli Voice</button>
            </div>

            <div id="status" class="mt-6 text-center text-[10px] font-bold text-gray-500 tracking-[3px] uppercase">System Ready...</div>

            <div id="player" class="mt-10 hidden glass p-6 rounded-3xl border-green-900/50">
                <audio id="audio" controls class="w-full"></audio>
                <a id="dl" class="mt-4 block text-center bg-green-600 py-3 rounded-xl font-bold hover:bg-green-500 transition-all">Download Audio File</a>
            </div>
        </div>
    </div>

    <script>
        // Aapki di hui key integrated hai
        const KEY = "sk_d8f2b3e4a5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0";

        async function generateAudio() {
            const text = document.getElementById('script').value;
            const voice = document.getElementById('voice').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if(!text) return;

            btn.disabled = true;
            btn.innerText = "Processing...";
            status.innerText = "Connecting ElevenLabs...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                    })
                });

                if(!response.ok) throw new Error("Quota/Key Issue");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                document.getElementById('audio').src = url;
                document.getElementById('dl').href = url;
                document.getElementById('dl').download = "Azeem_Studio_Voice.mp3";
                document.getElementById('player').classList.remove('hidden');
                status.innerText = "Voice Generated Successfully!";
            } catch (e) {
                alert("Quota khatam ho gaya Azeem bhai! Nayi key use karein.");
                status.innerText = "Error: Quota Exceeded";
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Asli Voice";
            }
        }
    </script>
</body>
</html>
