<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Unlimited AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #05070a; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .input-area { background: #0c0f16; border: 1px solid #1e293b; border-radius: 20px; width: 100%; height: 350px; padding: 25px; color: white; outline: none; resize: none; font-size: 18px; }
        .active-tab { background: linear-gradient(90deg, #4f46e5 0%, transparent 100%); border-left: 4px solid #818cf8; color: white; }
        .btn-gen { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); transition: 0.3s; cursor: pointer; }
        .btn-gen:hover { transform: scale(1.02); box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4); }
    </style>
</head>
<body class="flex h-screen">

    <aside class="w-80 glass flex flex-col p-6">
        <div class="mb-12 px-2">
            <h1 class="text-3xl font-black italic text-white uppercase">AZEEM STUDIO</h1>
            <p class="text-[9px] font-bold text-indigo-400 tracking-[4px] uppercase">Pak Viral Network</p>
        </div>

        <nav class="flex-1 space-y-2">
            <div onclick="showTab('synthesis')" id="nav-syn" class="active-tab px-5 py-4 flex items-center space-x-4 cursor-pointer rounded-r-xl transition font-bold">
                <i class="fas fa-microphone-alt"></i><span>Speech Synthesis</span>
            </div>
            <div onclick="showTab('cloning')" id="nav-clo" class="px-5 py-4 flex items-center space-x-4 cursor-pointer rounded-xl text-gray-500 hover:text-white transition font-bold">
                <i class="fas fa-clone"></i><span>Voice Cloning Pro</span>
            </div>
        </nav>

        <div class="mt-auto p-5 rounded-2xl bg-indigo-600/10 border border-indigo-500/20">
            <p class="text-[10px] font-black text-indigo-300 uppercase mb-3">JazzCash: 0326 6948481</p>
            <div class="flex justify-between items-center mb-4"><span class="text-xs font-bold">Status:</span><span class="text-xs font-black text-green-400">UNLIMITED</span></div>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-3 bg-white text-black text-[10px] font-black rounded-lg uppercase tracking-widest">Contact Owner</button>
        </div>
    </aside>

    <main class="flex-1 p-16 overflow-y-auto">
        
        <div id="tab-synthesis">
            <h2 class="text-5xl font-black italic mb-10 text-white uppercase tracking-tighter">Synthesis Lab</h2>
            <textarea id="textInput" class="input-area mb-8" placeholder="Azeem bhai, script likhein... Ye ab unlimited chale ga."></textarea>
            
            <div class="flex space-x-6 items-center">
                <select id="voiceSelect" class="bg-[#0c0f16] border border-gray-800 p-5 rounded-2xl text-indigo-400 font-bold w-72">
                    <option value="adam">Adam (ElevenLabs Pro)</option>
                    <option value="asad">Asad (Urdu News - Unlimited)</option>
                    <option value="female">Bella (Premium Female)</option>
                </select>
                <button onclick="generateAudio()" id="genBtn" class="btn-gen px-16 py-5 rounded-2xl text-[11px] font-black uppercase text-white">Generate & Play</button>
            </div>
        </div>

        <div id="tab-cloning" class="hidden">
            <h2 class="text-5xl font-black italic mb-10 text-white uppercase tracking-tighter">Voice Cloning</h2>
            <div class="bg-[#0c0f16] border-2 border-dashed border-indigo-500/20 p-20 rounded-[40px] text-center">
                <i class="fas fa-magic text-5xl text-indigo-500 mb-6"></i>
                <h3 class="text-2xl font-bold mb-4 text-white">Upload Sample to Clone</h3>
                <p class="text-gray-500 italic mb-8">AI will automatically remove background noise for 100% clarity.</p>
                <input type="file" id="voiceSample" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('voiceSample').click()" class="bg-indigo-600 px-10 py-4 rounded-xl font-bold uppercase text-[10px]">Select Audio File</button>
            </div>
        </div>

        <p class="mt-24 text-center text-[9px] text-gray-800 font-black tracking-[15px] uppercase">Property of Azeem Rana | Pak Viral</p>
    </main>

    <script>
        function showTab(tab) {
            document.getElementById('tab-synthesis').classList.toggle('hidden', tab !== 'synthesis');
            document.getElementById('tab-cloning').classList.toggle('hidden', tab !== 'cloning');
            document.getElementById('nav-syn').classList.toggle('active-tab', tab === 'synthesis');
            document.getElementById('nav-clo').classList.toggle('active-tab', tab === 'cloning');
        }

        async function generateAudio() {
            const text = document.getElementById('textInput').value;
            const voice = document.getElementById('voiceSelect').value;
            const btn = document.getElementById('genBtn');

            if(!text) return alert("Please enter script!");
            btn.innerText = "PROCESSING...";

            // Automatic Switch: Agar ElevenLabs quota khatam ho to unlimited engine par chala jaye
            try {
                const API_KEY = "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f";
                const vId = (voice === 'adam') ? 'pNInz6obpgDQGcFmaJgB' : 'EXAVITQu4vr4xnSDxMaL';

                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vId}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text, model_id: "eleven_multilingual_v2" })
                });

                if (!response.ok) throw new Error("Quota Full");

                const blob = await response.blob();
                new Audio(URL.createObjectURL(blob)).play();
            } catch (e) {
                // Unlimited Backup Engine (Taaki error na aaye)
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = (voice === 'asad') ? 'ur-PK' : 'en-US';
                window.speechSynthesis.speak(utter);
            } finally {
                btn.innerText = "Generate & Play";
            }
        }
    </script>
</body>
</html>
