<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElevenLabs Pro - Azeem Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { background-color: #06080f; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .sidebar { background: #0b0e14; border-right: 1px solid #1e293b; }
        .eleven-card { background: #0b0e14; border: 1px solid #1e293b; border-radius: 12px; }
        .input-box { background: #06080f; border: 1px solid #1e293b; border-radius: 8px; width: 100%; height: 300px; padding: 20px; color: white; outline: none; resize: none; font-size: 18px; }
        .btn-generate { background: #6366f1; transition: 0.3s; cursor: pointer; }
        .btn-generate:hover { background: #4f46e5; transform: scale(1.02); }
        .btn-generate:disabled { background: #334155; cursor: not-allowed; }
        audio { width: 100%; margin-top: 20px; filter: invert(100%); opacity: 0.8; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 sidebar flex flex-col p-4">
        <div class="flex items-center space-x-2 px-4 py-6 mb-4">
            <div class="w-8 h-8 bg-white rounded flex items-center justify-center"><i class="fas fa-waveform text-black"></i></div>
            <span class="text-xl font-bold text-white tracking-tight italic">elevenlabs</span>
        </div>
        <nav class="flex-1 space-y-1">
            <div class="bg-indigo-600/20 text-indigo-400 px-4 py-3 rounded-lg flex items-center space-x-3 text-sm font-bold"><i class="fas fa-microphone"></i><span>Speech Synthesis</span></div>
            <div onclick="document.getElementById('pay-modal').style.display='flex'" class="text-gray-500 hover:text-white px-4 py-3 rounded-lg flex items-center space-x-3 text-sm font-bold cursor-pointer transition"><i class="fas fa-vial"></i><span>Voice Cloning</span></div>
        </nav>
        <div class="mt-auto p-4 bg-indigo-600/10 border border-indigo-500/20 rounded-xl text-center">
            <p class="text-[10px] font-black text-indigo-400 uppercase mb-2 tracking-widest">AZEEM RANA PRO</p>
            <button onclick="document.getElementById('pay-modal').style.display='flex'" class="w-full py-2 bg-indigo-600 text-white text-[10px] font-black rounded hover:bg-indigo-500 uppercase transition">Upgrade Account</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-12">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-black italic tracking-tighter">Speech Synthesis</h1>
                <span id="apiStatus" class="text-[10px] font-bold bg-green-500/10 text-green-500 px-3 py-1 rounded-full border border-green-500/20 uppercase tracking-widest">● System Connected</span>
            </div>

            <div class="eleven-card p-8 shadow-2xl">
                <div class="mb-6 grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2 tracking-widest">Settings</label>
                        <div class="bg-[#161b26] border border-gray-700 p-4 rounded-lg flex justify-between items-center text-sm font-bold">
                            <span>Adam (Premium Voice)</span>
                            <i class="fas fa-chevron-down text-gray-500"></i>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-500 uppercase block mb-2 tracking-widest">Language Model</label>
                        <div class="bg-[#161b26] border border-gray-700 p-4 rounded-lg flex justify-between items-center text-sm font-medium">
                            <span>Multilingual v2</span>
                            <i class="fas fa-bolt text-indigo-400"></i>
                        </div>
                    </div>
                </div>

                <textarea id="textInput" class="input-box" placeholder="Azeem bhai, yahan script likhein aur 'Generate' dabayein..."></textarea>

                <div class="flex justify-between items-center mt-8">
                    <div id="status" class="text-xs font-medium text-gray-500 italic">Ready to generate...</div>
                    <button onclick="generateVoice()" id="genBtn" class="btn-generate px-12 py-4 rounded-xl font-black text-xs uppercase tracking-[2px] shadow-xl">
                        Generate Audio
                    </button>
                </div>

                <div id="playerContainer" class="mt-8 pt-8 border-t border-gray-800 hidden">
                    <audio id="audioPlayer" controls></audio>
                </div>
            </div>
        </div>
    </main>

    <div id="pay-modal" class="fixed inset-0 bg-black/95 hidden items-center justify-center z-50">
        <div class="bg-[#0b0e14] border border-indigo-500/30 w-full max-w-sm p-10 rounded-2xl text-center">
            <h3 class="text-2xl font-black mb-4 italic tracking-tighter">PREMIUM ACCESS</h3>
            <div class="bg-indigo-600/5 p-6 rounded-xl mb-8 border border-indigo-500/20 text-center">
                <p class="text-[9px] font-black text-indigo-400 uppercase tracking-widest mb-2">JazzCash / EasyPaisa</p>
                <p class="text-2xl font-black text-white italic">0326 6948481</p>
                <p class="text-[10px] text-gray-400 mt-2 font-bold uppercase">Account: AZEEM RANA</p>
            </div>
            <a href="https://wa.me/923266948481" target="_blank" class="block w-full bg-green-600 py-4 rounded-xl font-black text-xs uppercase tracking-widest mb-4 transition">Send Screenshot on WhatsApp</a>
            <button onclick="document.getElementById('pay-modal').style.display='none'" class="text-gray-600 text-[10px] font-bold uppercase">Close</button>
        </div>
    </div>

    <script>
        async function generateVoice() {
            const text = document.getElementById('textInput').value;
            const btn = document.getElementById('genBtn');
            const status = document.getElementById('status');
            const player = document.getElementById('audioPlayer');
            const container = document.getElementById('playerContainer');

            // --- AAPKI API KEY ---
            const API_KEY = "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f"; 
            const VOICE_ID = "pNInz6obpgDQGcFmaJgB"; // Adam Professional

            if(!text) {
                alert("Pehle kuch likhen!");
                return;
            }

            btn.disabled = true;
            status.innerText = "Processing high quality audio...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: {
                        'accept': 'audio/mpeg',
                        'xi-api-key': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.8 }
                    })
                });

                if (!response.ok) throw new Error('API Error! Shayad quota khatam ho gaya.');

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                status.innerText = "Success! Audio Generated.";
                player.src = url;
                container.classList.remove('hidden');
                player.play();

            } catch (error) {
                alert("Error: " + error.message);
                status.innerText = "Connection Failed.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
