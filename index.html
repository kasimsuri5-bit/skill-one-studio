<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Pro Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #05070a; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow: hidden; }
        .sidebar { background: rgba(11, 14, 20, 0.98); border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .input-area { background: #0c0f16; border: 1px solid #1e293b; border-radius: 20px; width: 100%; height: 320px; padding: 25px; color: white; outline: none; resize: none; font-size: 18px; }
        .btn-gen { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); transition: 0.3s; cursor: pointer; }
        .active-tab { background: linear-gradient(90deg, #4f46e5 0%, transparent 100%); border-left: 4px solid #818cf8; color: white; }
        .settings-panel { background: #0f172a; border: 1px solid #1e293b; border-radius: 15px; position: fixed; top: 20px; right: 20px; width: 300px; padding: 20px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; }
    </style>
</head>
<body class="flex h-screen">

    <div id="settingsPanel" class="settings-panel">
        <h4 class="text-xs font-black uppercase text-indigo-400 mb-4">ElevenLabs Settings</h4>
        <p class="text-[10px] text-gray-400 mb-3 italic">Quota khatam ho jaye to yahan nayi key daalein.</p>
        <input type="text" id="apiKeyInput" class="w-full bg-black border border-gray-800 p-3 rounded-lg text-xs text-white mb-4 outline-none focus:border-indigo-500" placeholder="Paste your API Key here...">
        <button onclick="saveApiKey()" class="w-full bg-indigo-600 py-2 rounded-lg text-[10px] font-bold uppercase">Save & Apply</button>
        <button onclick="toggleSettings()" class="w-full mt-2 text-[10px] text-gray-500 hover:text-white">Close</button>
    </div>

    <aside class="w-80 sidebar flex flex-col p-6">
        <div class="mb-12 px-2 flex justify-between items-start">
            <div>
                <h1 class="text-3xl font-black italic text-white uppercase leading-none">AZEEM STUDIO</h1>
                <p class="text-[9px] font-bold text-indigo-400 tracking-[4px] uppercase mt-1">Pak Viral Network</p>
            </div>
            <button onclick="toggleSettings()" class="text-gray-500 hover:text-white transition"><i class="fas fa-cog"></i></button>
        </div>
        <nav class="flex-1 space-y-2">
            <div onclick="showTab('synthesis')" id="nav-syn" class="active-tab px-5 py-4 flex items-center space-x-4 cursor-pointer rounded-r-xl transition font-bold">
                <i class="fas fa-microphone-alt"></i><span>Speech Synthesis</span>
            </div>
            <div onclick="showTab('cloning')" id="nav-clo" class="px-5 py-4 flex items-center space-x-4 cursor-pointer rounded-xl text-gray-500 hover:text-white transition font-bold">
                <i class="fas fa-magic"></i><span>Voice Cloning Pro</span>
            </div>
        </nav>
        <div class="mt-auto p-5 rounded-2xl bg-indigo-600/10 border border-indigo-500/20">
            <p class="text-[10px] font-black text-indigo-300 uppercase mb-2">JazzCash: 0326 6948481</p>
            <button onclick="window.open('https://wa.me/923266948481')" class="w-full py-3 bg-white text-black text-[10px] font-black rounded-lg uppercase">Contact Azeem Rana</button>
        </div>
    </aside>

    <main class="flex-1 p-16 overflow-y-auto">
        <div id="tab-synthesis">
            <h2 class="text-5xl font-black italic mb-10 text-white uppercase tracking-tighter">Real Synthesis</h2>
            <textarea id="textInput" maxlength="3000" class="input-area mb-8" placeholder="Azeem bhai, script likhein aur real voice payein..."></textarea>
            <div class="flex space-x-6 items-center mb-8">
                <select id="voiceSelect" class="bg-[#0c0f16] border border-gray-800 p-5 rounded-2xl text-indigo-400 font-bold w-72">
                    <option value="pNInz6obpgDQGcFmaJgB">Adam (Real Professional)</option>
                    <option value="EXAVITQu4vr4xnSDxMaL">Bella (Real Female)</option>
                    <option id="clonedVoiceId" value="">Select Cloned Voice (Upload First)</option>
                </select>
                <button onclick="generateRealVoice()" id="genBtn" class="btn-gen px-14 py-5 rounded-2xl text-[11px] font-black uppercase text-white">Generate Real Voice</button>
                <a id="dlBtn" class="hidden bg-green-600 px-10 py-5 rounded-2xl text-[11px] font-black uppercase text-white no-underline">Download MP3</a>
            </div>
            <audio id="mainPlayer" controls class="w-full hidden"></audio>
        </div>

        <div id="tab-cloning" class="hidden">
            <h2 class="text-5xl font-black italic mb-10 text-white uppercase tracking-tighter">Voice Cloning</h2>
            <div class="bg-[#0c0f16] border-2 border-dashed border-indigo-500/20 p-20 rounded-[40px] text-center">
                <i class="fas fa-upload text-5xl text-indigo-500 mb-6"></i>
                <h3 class="text-2xl font-bold mb-4 text-white">Upload Your Real Voice</h3>
                <input type="file" id="voiceFile" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('voiceFile').click()" class="bg-indigo-600 px-12 py-4 rounded-xl font-bold uppercase text-[10px]">Select Your File</button>
                <div id="fileStatus" class="mt-6 text-green-400 font-bold text-xs uppercase"></div>
            </div>
        </div>
    </main>

    <script>
        let currentApiKey = localStorage.getItem('elevenLabsKey') || "sk_77587988b8cf87c5defed977548e3f5dc9f080910c3f9c3f";
        document.getElementById('apiKeyInput').value = currentApiKey;

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        function saveApiKey() {
            currentApiKey = document.getElementById('apiKeyInput').value;
            localStorage.setItem('elevenLabsKey', currentApiKey);
            alert("API Key Saved Successfully!");
            toggleSettings();
        }

        function showTab(tab) {
            document.getElementById('tab-synthesis').classList.toggle('hidden', tab !== 'synthesis');
            document.getElementById('tab-cloning').classList.toggle('hidden', tab !== 'cloning');
            document.getElementById('nav-syn').classList.toggle('active-tab', tab === 'synthesis');
            document.getElementById('nav-clo').classList.toggle('active-tab', tab === 'cloning');
        }

        document.getElementById('voiceFile').onchange = async function(e) {
            const file = e.target.files[0];
            const status = document.getElementById('fileStatus');
            status.innerText = "CLONING YOUR REAL VOICE... PLEASE WAIT";

            const formData = new FormData();
            formData.append('name', 'MyClonedVoice');
            formData.append('files', file);

            try {
                const response = await fetch('https://api.elevenlabs.io/v1/voices/add', {
                    method: 'POST',
                    headers: { 'xi-api-key': currentApiKey },
                    body: formData
                });
                const data = await response.json();
                
                const opt = document.getElementById('clonedVoiceId');
                opt.value = data.voice_id;
                opt.innerText = "MY REAL VOICE (ACTIVE)";
                opt.selected = true;
                status.innerText = "SUCCESS: VOICE IS CLONED!";
                setTimeout(() => showTab('synthesis'), 1500);
            } catch (err) {
                status.innerText = "ERROR: Quota khatam ya key galat hai!";
            }
        };

        async function generateRealVoice() {
            const text = document.getElementById('textInput').value;
            const vId = document.getElementById('voiceSelect').value;
            const btn = document.getElementById('genBtn');
            const dl = document.getElementById('dlBtn');

            if(!text) return alert("Azeem bhai, script likhen!");
            if(!vId) return alert("Pehle apni awaz upload karein!");

            btn.innerText = "GENERATING REAL AUDIO...";
            dl.classList.add('hidden');

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${vId}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': currentApiKey, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.8 }
                    })
                });

                if(!response.ok) throw new Error("API Limit");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const player = document.getElementById('mainPlayer');
                player.src = url;
                player.play();

                dl.href = url;
                dl.download = "Azeem_Real_Voice.mp3";
                dl.classList.remove('hidden');
            } catch (err) {
                alert("Quota khatam! Sidebar ke ooper settings icon par click karke nayi key daalein.");
            } finally {
                btn.innerText = "Generate Real Voice";
            }
        }
    </script>
</body>
</html>
