<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Pak Viral Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0b0e14; color: #c9d1d9; font-family: 'Inter', sans-serif; }
        .sidebar { background: #010409; border-right: 1px solid #30363d; min-height: 100vh; }
        .glass-box { background: rgba(22, 27, 34, 0.9); border: 1px solid #30363d; border-radius: 24px; }
        .nav-item { transition: 0.3s; cursor: pointer; border-radius: 12px; margin-bottom: 8px; }
        .nav-item.active { background: #1f2937; color: #fff; border-left: 4px solid #3b82f6; }
        .btn-generate { background: #238636; transition: 0.3s; font-weight: 800; box-shadow: 0 4px 14px 0 rgba(35, 134, 54, 0.39); }
        .btn-generate:hover { background: #2ea043; transform: translateY(-2px); }
        textarea { scrollbar-width: thin; scrollbar-color: #30363d transparent; }
    </style>
</head>
<body class="flex">

    <div class="w-72 sidebar p-6 flex flex-col hidden md:flex">
        <div class="mb-12">
            <h1 class="text-3xl font-extrabold italic text-white tracking-tighter uppercase">AZEEM STUDIO</h1>
            <p class="text-[10px] text-blue-500 font-bold tracking-[3px] uppercase mt-1">Pak Viral Network</p>
        </div>

        <nav class="flex-1">
            <div class="nav-item active p-4 flex items-center gap-4">
                <i class="fas fa-bolt text-yellow-400"></i>
                <span class="font-bold text-sm tracking-wide">Unlimited Synthesis</span>
            </div>
            <div class="nav-item p-4 flex items-center gap-4 text-gray-500 hover:text-gray-300">
                <i class="fas fa-microphone-lines"></i>
                <span class="font-bold text-sm tracking-wide">Voice Cloning Pro</span>
            </div>
        </nav>

        <div class="mt-auto p-5 glass-box border-blue-900/40 bg-blue-950/10">
            <p class="text-[9px] font-bold text-gray-500 mb-3 uppercase tracking-widest">Support: 0326 6948481</p>
            <button class="w-full bg-white text-black text-[11px] font-black py-3 rounded-xl uppercase hover:bg-gray-200 transition-all">Contact Azeem Rana</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-16 overflow-y-auto">
        <div class="max-w-5xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-4">
                <div>
                    <h2 class="text-5xl md:text-7xl font-black text-white italic tracking-tighter uppercase">AI SYNTHESIS</h2>
                    <p class="text-gray-500 font-bold text-xs mt-2 tracking-[4px] uppercase">ElevenLabs Multilingual V2 Engine</p>
                </div>
                <div class="bg-green-500/10 border border-green-500/30 px-4 py-2 rounded-full">
                    <span class="text-[10px] font-bold text-green-500 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        Azeem Rana Engine Active
                    </span>
                </div>
            </div>

            <div class="glass-box p-8 mb-8 shadow-2xl ring-1 ring-white/5">
                <textarea id="script" class="w-full h-80 bg-transparent text-gray-100 text-2xl leading-relaxed outline-none resize-none" placeholder="Azeem bhai, apna documentary script yahan likhein..."></textarea>
            </div>

            <div class="flex flex-col md:flex-row gap-6 items-center">
                <div class="w-full md:w-1/3 relative">
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 block ml-1">Select Voice</label>
                    <select id="voice" class="w-full bg-[#161b22] border border-[#30363d] p-5 rounded-2xl font-bold text-white outline-none appearance-none cursor-pointer focus:border-blue-500 transition-all">
                        <option value="pNInz6obpgDQGcFmaJgB">Adam (Classic News Male)</option>
                        <option value="erXw7eAyq3QCqU2jt0pA">Antoni (Best for Urdu/Hindi)</option>
                        <option value="EXAVITQu4vr4xnSDxMaL">Sarah (Narrative Female)</option>
                        <option value="MF3mGyEYCl7XYWbTuNoX">Rachel (Professional Soft)</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-6 top-[70%] -translate-y-1/2 text-gray-500 pointer-events-none"></i>
                </div>

                <div class="w-full md:flex-1 pt-6">
                    <button onclick="generateAudio()" id="btn" class="w-full btn-generate py-5 rounded-2xl text-white uppercase tracking-[3px] text-sm flex items-center justify-center gap-4">
                        <i class="fas fa-play-circle text-xl"></i>
                        <span>Generate & Play Audio</span>
                    </button>
                </div>
            </div>

            <div id="status" class="mt-8 text-center text-[11px] font-bold text-gray-600 tracking-[5px] uppercase">Awaiting Script Input...</div>

            <div id="player" class="mt-12 hidden glass-box p-8 border-blue-500/20 bg-blue-900/5 shadow-inner">
                <div class="flex flex-col md:flex-row items-center gap-8">
                    <audio id="audio" controls class="flex-1 w-full"></audio>
                    <div class="flex gap-4 w-full md:w-auto">
                        <a id="dl" class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-500 p-5 rounded-2xl text-white transition-all shadow-lg flex items-center justify-center gap-3">
                            <i class="fas fa-download"></i>
                            <span class="md:hidden font-bold">Download</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Azeem bhai, apni ElevenLabs Key yahan daal den:
        const API_KEY = "YAHAN_APNI_KEY_PASTE_KAREIN";

        async function generateAudio() {
            const text = document.getElementById('script').value;
            const voice = document.getElementById('voice').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if(!text) {
                alert("Azeem bhai, pehle script to likhein!");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin text-xl"></i> <span>Synthesizing...</span>`;
            status.innerText = "Connecting to ElevenLabs Engine...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`, {
                    method: 'POST',
                    headers: { 
                        'xi-api-key': API_KEY, 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.8 }
                    })
                });

                if(!response.ok) {
                    const error = await response.json();
                    if(error.detail && error.detail.status === "quota_exceeded") {
                        throw new Error("QUOTA_FULL");
                    }
                    throw new Error("SYSTEM_ERROR");
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                const audioPlayer = document.getElementById('audio');
                audioPlayer.src = url;
                
                const downloadBtn = document.getElementById('dl');
                downloadBtn.href = url;
                downloadBtn.download = `Azeem_Studio_News_${Date.now()}.mp3`;
                
                document.getElementById('player').classList.remove('hidden');
                status.innerText = "Voice Generated Successfully!";
                audioPlayer.play();

            } catch (e) {
                if(e.message === "QUOTA_FULL") {
                    alert("Azeem bhai, is key ka quota khatam ho gaya! Nayi key lagayein.");
                } else {
                    alert("System Error! Key check karein ya internet.");
                }
                status.innerText = "Error Occurred.";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-play-circle text-xl"></i> <span>Generate & Play Audio</span>`;
            }
        }
    </script>
</body>
</html>
