<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Pak Viral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0b0e14; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background: #010409; border-right: 1px solid #30363d; min-height: 100vh; }
        .glass-box { background: rgba(22, 27, 34, 0.9); border: 1px solid #30363d; border-radius: 24px; }
        .nav-item { transition: 0.3s; cursor: pointer; border-radius: 12px; }
        .nav-item.active { background: #1f2937; color: #fff; border-left: 4px solid #3b82f6; }
        .btn-generate { background: #238636; transition: 0.3s; font-weight: 800; }
        .btn-generate:hover { background: #2ea043; transform: translateY(-2px); }
        textarea::placeholder { color: #484f58; }
    </style>
</head>
<body class="flex">

    <div class="w-72 sidebar p-6 flex flex-col">
        <div class="mb-12">
            <h1 class="text-3xl font-black italic text-white tracking-tighter">AZEEM STUDIO</h1>
            <p class="text-[10px] text-blue-500 font-bold tracking-[3px] uppercase">Pak Viral Network</p>
        </div>

        <nav class="space-y-4 flex-1">
            <div class="nav-item active p-4 flex items-center gap-4">
                <i class="fas fa-bolt text-yellow-400"></i>
                <span class="font-bold">Unlimited Synthesis</span>
            </div>
            <div class="nav-item p-4 flex items-center gap-4 text-gray-500">
                <i class="fas fa-microphone-lines"></i>
                <span class="font-bold">Voice Cloning Pro</span>
            </div>
        </nav>

        <div class="mt-auto p-5 glass-box border-blue-900/40">
            <p class="text-[9px] font-bold text-gray-500 mb-2">JAZZCASH: 0326 6948481</p>
            <button class="w-full bg-white text-black text-xs font-black py-3 rounded-xl uppercase">Contact Azeem Rana</button>
        </div>
    </div>

    <div class="flex-1 p-8 md:p-16">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-end mb-10">
                <h2 class="text-6xl font-black text-white italic tracking-tighter">AI SYNTHESIS</h2>
                <div class="text-right">
                    <span class="text-[10px] font-bold text-green-500 border border-green-500/30 px-3 py-1 rounded-full uppercase tracking-widest">● Multiple Engine Active</span>
                </div>
            </div>

            <div class="glass-box p-8 mb-8 shadow-2xl">
                <textarea id="script" class="w-full h-80 bg-transparent text-gray-100 text-2xl leading-relaxed outline-none resize-none" placeholder="Azeem bhai, ElevenLabs ka script yahan paste karein..."></textarea>
            </div>

            <div class="flex flex-col md:flex-row gap-6 items-center">
                <div class="w-full md:w-1/2 relative">
                    <select id="voice" class="w-full bg-[#161b22] border border-[#30363d] p-5 rounded-2xl font-bold text-white outline-none appearance-none cursor-pointer">
                        <option value="pNInz6obpgDQGcFmaJgB">Adam (Deep News - Male)</option>
                        <option value="erXw7eAyq3QCqU2jt0pA">Antoni (Urdu Specialist)</option>
                        <option value="EXAVITQu4vr4xnSDxMaL">Sarah (Documentary - Female)</option>
                    </select>
                    <i class="fas fa-chevron-down absolute right-6 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"></i>
                </div>

                <button onclick="generateAudio()" id="btn" class="w-full md:flex-1 btn-generate py-5 rounded-2xl text-white uppercase tracking-widest flex items-center justify-center gap-3">
                    <i class="fas fa-play"></i>
                    <span>Generate & Play</span>
                </button>
            </div>

            <div id="status" class="mt-8 text-center text-[11px] font-bold text-gray-600 tracking-[4px] uppercase">Engine Status: Ready to Generate</div>

            <div id="player" class="mt-12 hidden glass-box p-8 border-green-500/20">
                <div class="flex items-center gap-6">
                    <audio id="audio" controls class="flex-1"></audio>
                    <a id="dl" class="bg-blue-600 hover:bg-blue-500 p-5 rounded-2xl text-white transition-all shadow-lg shadow-blue-900/20">
                        <i class="fas fa-download text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Azeem bhai, apni ElevenLabs key yahan paste karein
        const API_KEY = "sk_d8f2b3e4a5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0";

        async function generateAudio() {
            const text = document.getElementById('script').value;
            const voice = document.getElementById('voice').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if(!text) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Processing...</span>`;
            status.innerText = "Connecting to ElevenLabs API...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`, {
                    method: 'POST',
                    headers: { 'xi-api-key': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.45, similarity_boost: 0.8 }
                    })
                });

                if(!response.ok) throw new Error("quota");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                document.getElementById('audio').src = url;
                document.getElementById('dl').href = url;
                document.getElementById('dl').download = `Azeem_Studio_${Date.now()}.mp3`;
                document.getElementById('player').classList.remove('hidden');
                status.innerText = "Voice Generated Successfully!";
            } catch (e) {
                alert("Quota khatam ho gaya Azeem bhai! ElevenLabs mein nayi key check karein.");
                status.innerText = "Error: Quota Exceeded";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-play"></i> <span>Generate & Play</span>`;
            }
        }
    </script>
</body>
</html>
