<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Pak Viral Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #e6edf3; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(22, 27, 34, 0.8); border: 1px solid #30363d; backdrop-filter: blur(10px); }
        .btn-glow { background: linear-gradient(135deg, #238636 0%, #2ea043 100%); transition: 0.3s; }
        .btn-glow:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(46, 160, 67, 0.4); }
    </style>
</head>
<body class="p-5 md:p-20">
    <div class="max-w-4xl mx-auto glass p-10 rounded-[40px] shadow-2xl">
        <div class="mb-10 border-b border-gray-700 pb-5">
            <h1 class="text-4xl font-black italic tracking-tighter text-white">AZEEM STUDIO</h1>
            <p class="text-blue-400 text-xs font-bold tracking-[3px] uppercase mt-2">Pak Viral Network • Active Engine</p>
        </div>

        <textarea id="script" class="w-full h-64 bg-[#010409] border border-[#30363d] rounded-2xl p-8 text-xl outline-none focus:border-green-500 transition-all mb-8" placeholder="Azeem bhai, apna script yahan likhein..."></textarea>

        <div class="flex flex-col md:flex-row gap-5 items-center">
            <select id="voice" class="w-full md:w-1/2 p-5 bg-[#161b22] border border-[#30363d] rounded-xl font-bold outline-none">
                <option value="pNInz6obpgDQGcFmaJgB">Adam (Deep News - Male)</option>
                <option value="erXw7eAyq3QCqU2jt0pA">Antoni (Best for Urdu/Hindi)</option>
                <option value="EXAVITQu4vr4xnSDxMaL">Sarah (Documentary - Female)</option>
            </select>
            
            <button onclick="generateAudio()" id="btn" class="w-full md:flex-1 btn-glow py-5 rounded-xl font-black uppercase tracking-widest text-sm">Generate Asli Voice</button>
        </div>

        <div id="status" class="mt-8 text-center text-xs font-bold text-gray-500 uppercase tracking-widest">System Ready...</div>
        
        <div id="playerBox" class="mt-10 hidden border-t border-gray-800 pt-10">
            <audio id="audio" controls class="w-full mb-5"></audio>
            <a id="download" class="block text-center bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all">Download Audio File</a>
        </div>
    </div>

    <script>
        // Azeem bhai, aapki di hui key yahan set kar di hai
        const API_KEY = "sk_d8f2b3e4a5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0";

        async function generateAudio() {
            const text = document.getElementById('script').value;
            const voice = document.getElementById('voice').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if(!text) return alert("Pehle script likhein!");

            btn.disabled = true;
            btn.innerText = "Processing...";
            status.innerText = "Connecting to ElevenLabs Engine...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voice}`, {
                    method: 'POST',
                    headers: {
                        'xi-api-key': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.8 }
                    })
                });

                if(!response.ok) {
                    const errorData = await response.json();
                    if(errorData.detail && errorData.detail.status === "quota_exceeded") {
                        throw new Error("Quota Khatam! Nayi key chahiye.");
                    }
                    throw new Error("Server Error");
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                
                document.getElementById('audio').src = url;
                document.getElementById('download').href = url;
                document.getElementById('download').download = "Azeem_Studio_Audio.mp3";
                document.getElementById('playerBox').classList.remove('hidden');
                
                status.innerText = "Success: Audio Generated!";
            } catch (err) {
                alert(err.message === "Quota Khatam! Nayi key chahiye." ? "Azeem bhai, is key ka quota bhi khatam ho gaya!" : "Kuch masla hai, dobara try karein.");
                status.innerText = "Status: Error occurred.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate Asli Voice";
            }
        }
    </script>
</body>
</html>
