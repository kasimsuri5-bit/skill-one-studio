<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Akool AI Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .sidebar { background: #080808; border-right: 1px solid #1a1a1a; }
        .akool-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .glass-panel { background: rgba(15, 15, 15, 0.9); border: 1px solid #222; border-radius: 24px; }
        .voice-card { background: #111; border: 1px solid #222; transition: 0.3s; cursor: pointer; }
        .voice-card:hover, .voice-card.active { border-color: #6366f1; background: #161616; }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="w-72 sidebar p-8 hidden md:flex flex-col">
        <div class="mb-10">
            <h1 class="text-3xl font-black italic tracking-tighter text-white">AZEEM STUDIO</h1>
            <p class="text-[10px] text-indigo-500 font-bold tracking-[4px] uppercase mt-1">Akool Intelligence</p>
        </div>

        <nav class="flex-1 space-y-4">
            <div class="p-4 bg-indigo-600/10 text-white rounded-xl border-l-4 border-indigo-500 flex items-center gap-3">
                <i class="fas fa-microphone-alt"></i> <span class="font-bold">Akool Voices</span>
            </div>
            <div class="p-4 text-gray-500 hover:text-white rounded-xl flex items-center gap-3 transition-all cursor-pointer">
                <i class="fas fa-users-viewfinder"></i> <span class="font-bold">Akool FaceSwap</span>
            </div>
            <div class="p-4 text-gray-500 hover:text-white rounded-xl flex items-center gap-3 transition-all cursor-pointer">
                <i class="fas fa-fingerprint"></i> <span class="font-bold">Akool Voice Clone</span>
            </div>
        </nav>

        <div class="mt-auto p-4 glass-panel border-indigo-900/30">
            <p class="text-[9px] text-gray-500 font-bold mb-2 uppercase text-center italic">Pak Viral Network</p>
            <button class="w-full bg-white text-black text-xs font-black py-3 rounded-lg uppercase">0326 6948481</button>
        </div>
    </div>

    <div class="flex-1 p-6 md:p-12 overflow-y-auto">
        <div class="max-w-5xl mx-auto">
            <h2 class="text-6xl font-black italic mb-10 tracking-tighter uppercase text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">Akool Synth</h2>

            <div class="glass-panel p-8 mb-8 shadow-2xl">
                <textarea id="script" class="w-full h-80 bg-transparent text-gray-100 text-2xl leading-relaxed outline-none resize-none" placeholder="Azeem bhai, Akool AI ka script yahan likhein..."></textarea>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="voice-card active p-4 rounded-xl text-center" onclick="selectVoice('akool_male_1')">
                    <p class="font-bold text-sm">Akool News</p>
                    <p class="text-[10px] text-gray-500 italic">Male / Deep</p>
                </div>
                <div class="voice-card p-4 rounded-xl text-center" onclick="selectVoice('akool_female_1')">
                    <p class="font-bold text-sm">Akool Story</p>
                    <p class="text-[10px] text-gray-500 italic">Female / Soft</p>
                </div>
                <div class="voice-card p-4 rounded-xl text-center" onclick="selectVoice('clone_1')">
                    <p class="font-bold text-sm text-indigo-400 italic">MY CLONE</p>
                    <p class="text-[10px] text-gray-500 italic">Azeem Rana</p>
                </div>
                <div class="voice-card p-4 rounded-xl text-center" onclick="selectVoice('akool_multi')">
                    <p class="font-bold text-sm">Multilingual</p>
                    <p class="text-[10px] text-gray-500 italic">Urdu / Hindi</p>
                </div>
            </div>

            <button onclick="processAkool()" id="btn" class="w-full akool-gradient py-6 rounded-[20px] text-white uppercase tracking-[5px] font-black text-sm flex items-center justify-center gap-4 shadow-xl">
                <i class="fas fa-bolt"></i>
                <span>Generate via Akool AI</span>
            </button>

            <div id="status" class="mt-6 text-center text-[11px] font-bold text-gray-600 tracking-widest uppercase italic">Engine Status: Waiting for Akool Token...</div>

            <div id="player" class="mt-10 hidden glass-panel p-8 border-indigo-500/20">
                <div class="flex flex-col md:flex-row items-center gap-6">
                    <audio id="audio" controls class="flex-1 w-full"></audio>
                    <div class="flex gap-4">
                        <a id="dl" class="bg-indigo-600 p-4 rounded-xl hover:bg-indigo-500 transition-all">
                            <i class="fas fa-download"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Akool API Settings
        const AKOOL_TOKEN = "YAHAN_AKOOL_TOKEN_DAALEIN";
        let selectedVoice = "akool_male_1";

        function selectVoice(id) {
            selectedVoice = id;
            document.querySelectorAll('.voice-card').forEach(c => c.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        async function processAkool() {
            const text = document.getElementById('script').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if(!text) return;

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-sync-alt fa-spin"></i> <span>Akool Processing...</span>`;
            status.innerText = "Connecting to Akool Cloud...";

            // Akool Voice API Logic
            try {
                // Note: Akool uses a different API structure than ElevenLabs
                const response = await fetch('https://api.akool.com/api/v1/voice/tts', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${AKOOL_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        voice_id: selectedVoice,
                        quality: "high"
                    })
                });

                if(!response.ok) throw new Error("Akool_Error");

                const data = await response.json();
                // Akool usually returns a URL or a Job ID
                const audioUrl = data.data.url; 
                
                document.getElementById('audio').src = audioUrl;
                document.getElementById('dl').href = audioUrl;
                document.getElementById('dl').download = "Akool_Azeem_Studio.mp3";
                document.getElementById('player').classList.remove('hidden');
                
                status.innerText = "Success: Akool Generated Audio!";
            } catch (e) {
                alert("Azeem bhai, Akool Token galat hai ya credits khatam ho gaye!");
                status.innerText = "Status: Akool Connection Failed";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-bolt"></i> <span>Generate via Akool AI</span>`;
            }
        }
    </script>
</body>
</html>
