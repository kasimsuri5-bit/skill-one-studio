<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEEM STUDIO | Instant Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .glass-card { background: #0a0a0a; border: 1px solid #222; border-radius: 30px; }
        .upload-zone { border: 2px dashed #444; transition: 0.3s; cursor: pointer; }
        .upload-zone:hover { border-color: #6366f1; background: #0f0f1a; }
        .btn-premium { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); font-weight: 900; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <div class="mb-10 text-center">
            <h1 class="text-4xl font-black italic tracking-tighter">AZEEM STUDIO PRO</h1>
            <p class="text-indigo-500 text-[10px] font-bold tracking-[5px] uppercase mt-2">Instant Voice Cloning Engine</p>
        </div>

        <div class="glass-card p-8 mb-8">
            <h3 class="text-sm font-bold uppercase tracking-widest mb-4 text-gray-400">Step 1: Upload Your 1-Min Audio</h3>
            <div class="upload-zone p-10 rounded-2xl text-center" id="dropZone">
                <i class="fas fa-microphone-lines text-4xl text-indigo-500 mb-4"></i>
                <p class="text-sm font-bold">Apni aawaz ki file yahan drop karein</p>
                <input type="file" id="voiceFile" class="hidden" accept="audio/*">
                <button onclick="document.getElementById('voiceFile').click()" class="mt-4 text-[10px] bg-white text-black px-4 py-2 rounded-lg font-black">SELECT FILE</button>
            </div>
        </div>

        <div class="glass-card p-8 mb-8">
            <h3 class="text-sm font-bold uppercase tracking-widest mb-4 text-gray-400">Step 2: Enter Script</h3>
            <textarea id="script" class="w-full h-40 bg-transparent text-xl outline-none resize-none" placeholder="Azeem bhai, ab jo bulwana hai wo likhein..."></textarea>
        </div>

        <button onclick="cloneAndSpeak()" id="btn" class="w-full btn-premium py-6 rounded-2xl uppercase tracking-[5px] text-sm flex items-center justify-center gap-4">
            <i class="fas fa-dna"></i>
            <span>Clone & Generate Audio</span>
        </button>

        <div id="status" class="mt-6 text-center text-[10px] font-bold text-gray-600 uppercase tracking-widest italic">Ready to Clone...</div>
    </div>

    <script>
        const API_KEY = "PASTE_YOUR_ELEVENLABS_KEY"; // Key yahan lagani hai

        async function cloneAndSpeak() {
            const fileInput = document.getElementById('voiceFile');
            const script = document.getElementById('script').value;
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');

            if (!fileInput.files[0] || !script) {
                alert("Azeem bhai, pehle file aur script dono check kar lein!");
                return;
            }

            btn.disabled = true;
            status.innerText = "Step 1: Cloning Your Voice (Uploading)...";

            try {
                // 1. Voice Clone karne ka API Call
                const formData = new FormData();
                formData.append('name', 'Azeem Clone');
                formData.append('files', fileInput.files[0]);

                const addVoiceRes = await fetch('https://api.elevenlabs.io/v1/voices/add', {
                    method: 'POST',
                    headers: { 'xi-api-key': API_KEY },
                    body: formData
                });

                const voiceData = await addVoiceRes.json();
                const voiceId = voiceData.voice_id;

                status.innerText = "Step 2: Generating Speech in Your Voice...";

                // 2. Us voice ID se text bolne ka API Call
                const ttsRes = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                    method: 'POST',
                    headers: {
                        'xi-api-key': API_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: script })
                });

                const audioBlob = await ttsRes.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play();

                status.innerText = "Done! Audio Generated.";
            } catch (e) {
                status.innerText = "Error: Key expired or invalid file.";
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
